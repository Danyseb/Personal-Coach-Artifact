<title>Coach Daniel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first gym logbook — sticky header + tab rail, single column of panels, wide tables scroll in place */
/* Light = white + blue · Dark = black + orange. Accent carries tabs, frame, charts; semantic ok/warn reuse the accent, only health alerts use red */
:root{
  --bg:#f6f9fd; --surface:#ffffff; --sunk:#edf2fa; --line:#d5e0ef; --fg:#0f203a; --muted:#5b6c86;
  --accent:#1d5fd8; --accent-fg:#ffffff; --accent-soft:#e2ebfb; --accent-mid:#9fbbee;
  --ink:var(--accent); --ink-fg:var(--accent-fg);
  --ok:#1d5fd8; --warn:#3c5f99; --bad:#b03a2e;
  --ok-bg:#e2ebfb; --warn-bg:#eef2f8; --bad-bg:#f8e3e0;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#141312; --sunk:#1e1b19; --line:#322d29; --fg:#f3ede6; --muted:#a59b91;
  --accent:#ff8a1e; --accent-fg:#160c03; --accent-soft:#2b1a0b; --accent-mid:#7a4415;
  --ok:#ff8a1e; --warn:#d9a46e; --bad:#f07a6c;
  --ok-bg:#2b1a0b; --warn-bg:#241d16; --bad-bg:#331714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#141312; --sunk:#1e1b19; --line:#322d29; --fg:#f3ede6; --muted:#a59b91;
  --accent:#ff8a1e; --accent-fg:#160c03; --accent-soft:#2b1a0b; --accent-mid:#7a4415;
  --ok:#ff8a1e; --warn:#d9a46e; --bad:#f07a6c;
  --ok-bg:#2b1a0b; --warn-bg:#241d16; --bad-bg:#331714; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand-r{display:flex;align-items:center;gap:12px;min-width:0}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.theme{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px;font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;flex:0 0 auto}
.theme .trk{position:relative;width:46px;height:26px;border-radius:999px;background:var(--sunk);border:1px solid var(--accent-mid)}
.theme .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-size:11px;line-height:1}
.theme[aria-checked="true"] .knob{left:22px}
@media (prefers-reduced-motion:no-preference){.theme .knob{transition:left .18s}}
@media (max-width:420px){.sync{display:none}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ink-fg)}
.tabs button:not([aria-selected="true"]):hover{color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--accent-mid)}
.daynum{color:var(--accent)}
details.day[open]{border-color:var(--accent-mid)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.chart .bar{fill:var(--accent-mid)}
.chart .bar.hi{fill:var(--accent)}
.chart .vl{fill:var(--fg)}
main{display:flex;flex-direction:column;gap:18px;padding-top:18px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--muted)}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0;letter-spacing:normal;text-transform:none;font-weight:400}
textarea{min-height:76px;resize:vertical}
input[type=number],.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.btn{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:10px 16px;min-height:46px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.small{min-height:36px;font-size:14px;padding:6px 12px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.stat .x{font-size:12px;color:var(--muted);line-height:1.35}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.note{border-radius:8px;padding:10px 12px;font-size:14px}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note b{font-weight:600}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}
/* routine editor */
details.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.day>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
.daynum{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px}
.daytitle{font-weight:600;min-width:0;flex:1}
.daytitle small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.daybody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.block-head{display:flex;gap:8px;align-items:center}
.block-head input{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.05em;background:transparent;border-color:transparent;padding:6px 4px;flex:1;min-width:0}
.iconbtn{width:34px;height:34px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.iconbtn[disabled]{opacity:.35;cursor:default}
.iconbtn.armed{width:auto;padding:0 10px;color:var(--bad);border-color:var(--bad);font-size:13px}
/* routine sections: read view */
.sec{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sec .m,.sec-h .m,.plain .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plain li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.plain li small,.rx-n small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.blk-t{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.rx{display:flex;justify-content:space-between;gap:8px 12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.rx-n{font-weight:600;min-width:0;flex:1 1 170px}
.rx-c{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent);font-weight:500}
/* routine sections: edit view */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:6px;align-items:center}
.wrow input,.tcard input,.tcard select{padding:8px;font-size:15px}
.mv{display:flex;gap:4px}
.blk-edit{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--accent-mid);border-radius:8px}
.tcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.tcard .top{display:flex;gap:6px;align-items:center}
.tcard .top>input{flex:1;min-width:0;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
@media (max-width:520px){.wrow{grid-template-columns:minmax(0,1fr) 100px}.wrow .mv{grid-column:1/-1;justify-content:flex-end}}
.hoy-sec{padding:4px 2px 0}
.shop-add{display:grid;grid-template-columns:minmax(0,1fr) 110px 130px auto;gap:6px;align-items:center}
@media (max-width:620px){.shop-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.shop-add #shop-text{grid-column:1/-1}.shop-add button{grid-column:1/-1}}
.shop-g{display:flex;flex-direction:column}
.shop-row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop-t{flex:1;min-width:0;overflow-wrap:anywhere}
.shop-row.is-done .shop-t{text-decoration:line-through;color:var(--muted)}
#shop-clear.armed{color:var(--bad);border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--accent-mid);border-radius:999px;overflow:hidden;flex:0 0 auto}
.seg button{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);border:0;padding:6px 12px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.hoy-blk{margin:6px 2px -6px}
/* today */
.ex{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.ex-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.sets .h{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.sets .n{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:center}
.sets input{text-align:center;font-size:18px;padding:12px 4px}
.last{font-size:13px;color:var(--muted)}
.last b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.checklist label span{flex:1;min-width:0}
.checklist .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* tables & charts */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2}
.chart .ar{fill:var(--accent-soft)}
.chart .dt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center}
.goals{display:flex;flex-direction:column;gap:6px}
.goal{display:grid;grid-template-columns:24px 110px minmax(0,1fr) 34px;gap:8px;align-items:center}
@media (max-width:520px){.goal{grid-template-columns:24px minmax(0,1fr) 34px}.goal .ga{display:none}}
.ai-out{white-space:pre-wrap;font-size:15px;line-height:1.6;background:var(--sunk);border-radius:8px;padding:14px;min-height:60px}
.ai-out h4{font-family:var(--f-display);font-size:18px;text-transform:uppercase;margin:10px 0 2px;letter-spacing:.04em}
.mealhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.food{display:grid;grid-template-columns:minmax(0,2fr) repeat(5,minmax(52px,.7fr)) 34px;gap:6px;align-items:center}
.food input{padding:8px 6px;font-size:14px}
@media (max-width:620px){.food{grid-template-columns:repeat(5,minmax(0,1fr)) 34px}.food .fn{grid-column:1/-1}.food-h{display:none}}
.food-h{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.guide li::marker{color:var(--accent);font-weight:600}
.guide b{color:var(--fg)}
.guide .kbd{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ink-fg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:background .15s,color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Coach<span>.</span></h1><div class="brand-r"><div class="sync" id="sync">Cargando…</div><button class="theme" id="theme" role="switch" aria-checked="false" aria-label="Modo oscuro"><span id="theme-lab">Claro</span><span class="trk"><span class="knob" id="theme-ic">☀</span></span></button></div></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ======================= defaults ======================= */
const uid=()=>Math.random().toString(36).slice(2,9);
/* Routine model v2: every day = warmup (checklist) + training blocks (logged set by set) + cooldown (checklist) */
const I=(name,sets,reps,o={})=>({id:uid(),name,sets:String(sets),reps:String(reps),load:o.load||"",rir:o.rir||"",dist:o.dist||"",du:o.du||"",rest:o.rest||"",notes:o.notes||""});
const W=(name,amount="",notes="")=>({id:uid(),name,amount,notes});
/* distance defaults from the program */
const DIST_DEFAULTS={"Light Jog":["400","m"],"Long Run":["9","km"],"Run":["200","m"],"Farmer Carry":["40","m"],"Sled Push (si hay gym)":["","m"]};
const WARM_RE=/warm|calent/i, COOL_RE=/cool|stretch|mobility|movilidad|enfri|estir|cierre|recuper/i, COOL_ITEM_RE=/recovery walk/i;
function toW(it){
  const reps=String(it.reps??"").trim(),sets=String(it.sets??"").trim();
  let a=(!reps||reps==="—")?"":reps;
  if(a&&/^\d+$/.test(sets)&&+sets>1)a=`${sets} × ${a}`;
  if(!a&&it.dist)a=`${it.dist} ${it.du||""}`.trim();
  return {id:it.id||uid(),name:it.name,amount:a,notes:it.notes||""};
}
function toT(it){
  const t={id:it.id||uid(),name:it.name,sets:String(it.sets??""),reps:String(it.reps??""),load:it.load||"",rir:it.rir??"",dist:it.dist??"",du:it.du??"",rest:it.rest||"",notes:it.notes||""};
  const d=DIST_DEFAULTS[t.name];
  if(d&&!t.du&&!t.dist){t.dist=d[0];t.du=d[1];if(t.reps.replace(/\s/g,"")===d[0]+d[1])t.reps="—"}
  return t;
}
/* converts the old one-list-per-block routine (and the removed daily practice) into sections; returns true if it changed anything */
function migrateRoutine(r){
  if(r.schema===2){let ch=false;(r.days||[]).forEach(d=>{for(const k of ["warmup","cooldown","blocks"]) if(!Array.isArray(d[k])){d[k]=[];ch=true}});return ch}
  r.days=(r.days||[]).map(d=>{
    const nd={id:d.id,title:d.title,focus:d.focus||"",warmup:[],blocks:[],cooldown:[]};
    (d.blocks||[]).forEach(b=>{
      if(WARM_RE.test(b.title)) nd.warmup.push(...b.items.map(toW));
      else if(COOL_RE.test(b.title)) nd.cooldown.push(...b.items.map(toW));
      else{const keep=[];b.items.forEach(it=>COOL_ITEM_RE.test(it.name)?nd.cooldown.unshift(toW(it)):keep.push(toT(it)));if(keep.length)nd.blocks.push({id:b.id||uid(),title:b.title,items:keep})}
    });
    return nd;
  });
  delete r.daily; r.schema=2; r.goals=r.goals||[];
  return true;
}
const B=(title,items)=>({id:uid(),title,items});
const BASE_ROUTINE=()=>{const r=BASE_V1();migrateRoutine(r);return r};
const BASE_V1=()=>({
  name:"Hybrid Athlete & Calisthenics v2.0",
  days:[
    {id:"d1",title:"Vertical Push & Pull Strength",focus:"Handstand focus",blocks:[

function lsLoad(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}

const pending={}, writing={};
function saveDoc(key){lsSave();setSync();if(!db)return;clearTimeout(pending[key]);pending[key]=setTimeout(()=>flush(key),700)}
async function flush(key){
  if(writing[key]){pending[key]=setTimeout(()=>flush(key),400);return}
  writing[key]=true;setSync("Guardando…");
  try{await db.doc("coach/"+key).set({data:JSON.parse(JSON.stringify(S[key])),updated:new Date().toISOString()});if(key==="routine")routineSaved=true;setSync()}
  catch(e){setSync("No se pudo guardar en la nube ("+(e&&e.code||"error")+"). Copia local OK.")}
  finally{writing[key]=false}
}
async function saveRecord(coll,rec){lsSave();if(!db)return;try{await db.collection(coll).doc(rec.id).set(JSON.parse(JSON.stringify(rec)))}catch(e){toast("No se guardó en la nube; queda copia local")}}
async function delRecord(coll,id){lsSave();if(!db)return;try{await db.collection(coll).doc(id).delete()}catch(e){}}
function setSync(t){const el=document.getElementById("sync");if(t){el.textContent=t;return}
  el.textContent=dbState==="cloud"?"Guardado en la nube":dbState==="local"?"Guardado en este navegador":"Conectando…"}

async function initDb(){
  try{
    const c=window.claude; db=c&&c.use?await c.use("db"):null;
  }catch(e){db=null}
  if(!db){dbState="local";setSync();return}
  dbState="loading";setSync();
  const timer=setTimeout(()=>{if(dbState==="loading"){dbState="local";setSync()}},10000);
  try{
    for(const key of ["profile","routine","menu","shopping"]){
      const snap=await db.doc("coach/"+key).get();
      if(snap.exists&&snap.data().data){S[key]=JSON.parse(JSON.stringify(snap.data().data));if(key==="routine")routineSaved=true}
      else if(loc&&loc[key]) await db.doc("coach/"+key).set({data:loc[key],updated:new Date().toISOString()});
    }
    S.profile=Object.assign(BASE_PROFILE(),S.profile);
    if(migrateRoutine(S.routine)) await db.doc("coach/routine").set({data:JSON.parse(JSON.stringify(S.routine)),updated:new Date().toISOString()});
    for(const coll of ["logs","checkins"]){
      const qs=await db.collection(coll).get();
      const remote=qs.docs.map(d=>JSON.parse(JSON.stringify(d.data())));
      const ids=new Set(remote.map(r=>r.id));
      const localOnly=(loc&&loc[coll]||[]).filter(r=>!ids.has(r.id));
      for(const r of localOnly){await db.collection(coll).doc(r.id).set(r);remote.push(r)}
      S[coll]=remote.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    }
    clearTimeout(timer);dbState="cloud";lsSave();setSync();render();
  }catch(e){clearTimeout(timer);dbState="local";setSync("Sin nube ("+(e&&e.code||"error")+"); usando copia local")}
}

/* ======================= nutrition math ======================= */
function activity(days){days=+days||0;return days<=1?1.2:days<=3?1.375:days<=5?1.55:1.725}
function nutrition(){
  const p=S.profile,w=num(p.weight),h=num(p.height),a=num(p.age);
  if(!w||!h||!a) return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==="f"?-161:5);
  const af=activity(p.days), tdee=bmr*af;
  let pct=0,lab="Mantenimiento";
  if(p.goal==="grasa"){pct=-(num(p.deficitPct)||17)/100;lab="Déficit "+Math.abs(pct*100)+"%"}
  if(p.goal==="masa"){pct=(num(p.surplusPct)||7)/100;lab="Superávit "+(pct*100)+"%"}
  const adj=num(p.kcalAdjust)||0;
  const kcal=tdee*(1+pct)+adj;
  const prot=(num(p.protPerKg)||2)*w, fat=(num(p.fatPerKg)||.9)*w;
  const carbs=Math.max(0,(kcal-prot*4-fat*9)/4);
  return {bmr,af,tdee,pct,lab,adj,kcal,prot,fat,carbs,w};
}

/* ======================= training math ======================= */
function trackedExercises(){const s=new Set();S.routine.days.forEach(d=>d.blocks.forEach(b=>b.items.forEach(i=>s.add(i.name))));return [...s]}
/* distance helpers: everything is compared in metres, shown in the unit it was logged in */
/* weight can be logged as total or per dumbbell (DB); comparisons always use the total */
const kgTot=e=>(num(e.kg)||0)*(e.kgMode==="db"?2:1);
const toM=(d,u)=>d==null||d===""?null:(num(d)||0)*(u==="km"?1000:1);
const fmtDist=(m,u)=>m==null?"":u==="km"?`${r1(m/1000)} km`:`${r0(m)} m`;
function setLabel(s){
  const parts=[];
  if(num(s.kg)) parts.push(`${s.kg}kg${s.kgMode==="db"?" DB":""}`);
  if(s.reps!=null&&s.reps!=="") parts.push(parts.length?`×${s.reps}`:`${s.reps}`);
  if(s.du&&s.dist!=null&&s.dist!=="") parts.push(`${parts.length?" · ":""}${s.dist}${s.du}`);
  if(s.rir!=null&&s.rir!=="") parts.push(` @${s.rir}`);
  return parts.join("")||"–";
}
function sessionsFor(ex){
  return S.logs.filter(l=>l.entries.some(e=>e.ex===ex&&(num(e.kg)!==null||num(e.reps)!==null||num(e.dist)!==null)))
    .map(l=>{const es=l.entries.filter(e=>e.ex===ex);
      const top=es.reduce((b,e)=>{const c={kg:kgTot(e),reps:num(e.reps)||0,m:toM(e.dist,e.du)||0,rir:num(e.rir),du:e.du||""};return(!b||better(c,b))?c:b},null);
      const totalM=es.reduce((a,e)=>a+(toM(e.dist,e.du)||0),0);
      return {id:l.id,date:l.date,sets:es,top,totalM,du:(es.find(e=>e.du)||{}).du||""}}).sort((a,b)=>a.date.localeCompare(b.date));
}
function better(a,b){return a.kg>b.kg||(a.kg===b.kg&&(a.reps>b.reps||(a.reps===b.reps&&(a.m||0)>(b.m||0))))}
function topLabel(t){return t.m&&!t.kg&&!t.reps?fmtDist(t.m,t.du):`${t.kg} kg × ${t.reps}${t.m?` · ${fmtDist(t.m,t.du)}`:""}`}
function topReps(r){const m=String(r).match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return +m[2];const n=num(r);return n}
function progressionHint(item){
  const ss=sessionsFor(item.name).filter(x=>!draft||(x.id!==draft.editId&&x.date<=draft.date)), rirT=num(item.rir);
  if(!ss.length) return {t:`Primera vez: elige una carga con RIR ${rirT??2} y regístrala.`,c:""};
  if(redFlag()) return {t:"Aumentos de carga en pausa por un aviso de salud reciente. Mantén la carga.",c:"bad"};
  const last=ss[ss.length-1],top=topReps(item.reps);
  const rirs=last.sets.map(s=>num(s.rir)).filter(v=>v!==null);
  const avgRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
  /* distance-based work: runs, carries, sled */
  if(item.du){
    const targetM=toM(item.dist,item.du), loaded=last.sets.some(s=>num(s.kg));
    const doneAll=targetM&&last.sets.length&&last.sets.every(s=>(toM(s.dist,s.du)||0)>=targetM);
    if(loaded){
      if(doneAll&&(avgRir===null||avgRir>=(rirT??1))) return {t:`Completaste ${fmtDist(targetM,item.du)} en todas las series: sube 2.5–5 kg por mano y mantén la distancia.`,c:"ok"};
      if(targetM&&!doneAll) return {t:`Misma carga hasta completar ${fmtDist(targetM,item.du)} en cada serie sin soltar.`,c:""};
      return {t:"Misma carga; busca más distancia o menos pausas.",c:""};
    }
    const lastM=last.totalM;
    if(lastM) return {t:`Última vez: ${fmtDist(lastM,item.du)}. Progresión segura: +5–10% por semana (≈ ${fmtDist(lastM*1.07,item.du)}) a ritmo conversacional; cada 4ª semana repite o baja.`,c:"ok"};
  }
  if(avgRir!==null&&rirT!==null&&avgRir<rirT-0.5) return {t:`Quedaste más cerca del fallo (RIR prom. ${r1(avgRir)}) que tu objetivo (RIR ${rirT}). Repite la carga y prioriza técnica.`,c:"warn"};
  const hit=top&&last.sets.length&&last.sets.every(s=>(num(s.reps)||0)>=top);
  const rirOk=last.sets.every(s=>num(s.rir)===null||num(s.rir)>=(rirT??1));
  if(hit&&rirOk) return {t:`Llegaste al tope del rango con RIR ≥ ${rirT??1}: sube ${item.kgMode==="db"?"1–2 kg por mancuerna":"1.25–2.5 kg"} (o pasa a la siguiente progresión).`,c:"ok"};
  if(hit) return {t:`Tope del rango, pero por debajo de RIR ${rirT??1}: repite carga antes de subir.`,c:"warn"};
  if(avgRir!==null&&rirT!==null&&avgRir>rirT+1.5) return {t:`Te sobraron reps (RIR prom. ${r1(avgRir)} vs objetivo ${rirT}): sube reps o carga la próxima.`,c:"ok"};
  return {t:"Misma carga, busca +1 rep en alguna serie.",c:""};
}
function stalls(){
  const out=[];
  for(const ex of trackedExercises()){
    const ss=sessionsFor(ex); if(ss.length<4) continue;
    const base=ss[ss.length-4].top, last3=ss.slice(-3);
    let best=base, improved=false;
    for(const s of last3){if(better(s.top,best)){improved=true;best=s.top}}
    if(!improved) out.push({ex,base,last3});
  }
  return out;
}
function suggestions(){
  const out=[], p=S.profile, c=S.checkins;
  if(c.length>=3){
    const [a,b,d]=c.slice(-3), w=x=>num(x.weight);
    const d1=w(b)-w(a), d2=w(d)-w(b), adh=Math.min(num(b.adherence)||0,num(d.adherence)||0);
    if(w(a)&&w(b)&&w(d)&&adh>=80){
      if(p.goal==="grasa"&&d1>=-0.1&&d2>=-0.1) out.push({type:"calorias",delta:-150,title:"Bajar 150 kcal",why:`Peso sin bajar 2 semanas seguidas (${w(a)} → ${w(b)} → ${w(d)} kg) con adherencia ≥ ${adh}%.`});
      if(p.goal==="masa"&&d1<=0.05&&d2<=0.05) out.push({type:"calorias",delta:150,title:"Subir 150 kcal",why:`Peso sin subir 2 semanas seguidas (${w(a)} → ${w(b)} → ${w(d)} kg) con adherencia ≥ ${adh}%.`});
    }
  }
  if(c.length>=2){
    const l=c.slice(-2), e=(num(l[0].energy)+num(l[1].energy))/2, s=(num(l[0].sleep)+num(l[1].sleep))/2;
    if(isFinite(e)&&isFinite(s)&&(e<5||s<5)) out.push({type:"volumen",title:"Reducir volumen 20%",why:`Energía promedio ${r1(e)}/10, sueño ${r1(s)}/10 en las últimas 2 semanas.`});
  }
  for(const st of stalls()) out.push({type:"ejercicio",ex:st.ex,title:`Cambiar esquema: ${st.ex}`,why:`3 sesiones sin superar ${topLabel(st.base)}. Prueba otro rango (p. ej. 5×5 ↔ 3×8–10), una variante o una semana de descarga.`});
  return out;
}

<div class="grid">${fld("profile.name","Nombre")}${fld("profile.age","Edad","number")}${sel("profile.sex","Sexo",[["m","Hombre"],["f","Mujer"]])}${fld("profile.height","Estatura (cm)","number")}${fld("profile.weight","Peso actual (kg)","number")}${fld("profile.experience","Experiencia")}</div>
</section>
<section class="panel"><h2>Objetivo</h2>
<div class="grid">${sel("profile.goal","Objetivo",[["grasa","Bajar grasa"],["masa","Ganar masa"],["resistencia","Rendimiento / recomposición"]])}${fld("profile.metaMedible","Meta medible")}${fld("profile.fechaMeta","Fecha meta","date")}${fld("profile.days","Días de entreno / semana","number")}${fld("profile.minutes","Minutos por sesión","number")}${sel("profile.checkinDay","Día de check-in",["lunes","martes","miércoles","jueves","viernes","sábado","domingo"].map(d=>[d,d]))}</div>
</section>
<section class="panel"><h2>Contexto</h2>
<div class="grid wide">${area("profile.place","Dónde entrenas")}${area("profile.equipment","Equipo disponible")}${area("profile.injuries","Lesiones / molestias")}${area("profile.foodsLike","Alimentos habituales")}${area("profile.foodsAvoid","Alimentos que no comes")}${fld("profile.cookPerWeek","Veces que cocinas / semana","number")}</div>
</section>
<section class="panel"><h3>Datos</h3><div class="row"><button class="btn small" id="btn-export">Copiar respaldo (JSON)</button><span class="lead" style="font-size:13px">Por si quieres guardarlo en tu repo de GitHub.</span></div></section>`;
AFTER.perfil=()=>{$("#btn-export").onclick=async()=>{const t=JSON.stringify(S,null,2);try{await navigator.clipboard.writeText(t);toast("Respaldo copiado")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.append(ta);ta.select();toast("Selecciona y copia el texto");setTimeout(()=>ta.remove(),8000)}}};

/* ---------- NUTRICIÓN ---------- */
VIEWS.nutricion=()=>`
<section class="panel"><div class="mealhead"><h2>Lista de compras</h2><span class="pill" id="shop-count"></span></div>
<p class="lead">Anota lo que necesitas comprar en cuanto te acuerdes. Palomea al comprarlo.</p>
<form class="shop-add" id="shop-form" autocomplete="off">
  <input id="shop-text" placeholder="Ej. Pechuga de pollo, báscula para mancuernas…" aria-label="Qué comprar" maxlength="120">
  <input id="shop-qty" placeholder="Cantidad" aria-label="Cantidad" maxlength="30">
  <select id="shop-cat" aria-label="Categoría">${SHOP_CATS.map(c=>`<option ${c===shopCat?"selected":""}>${c}</option>`).join("")}</select>
  <button class="btn primary small" type="submit">Agregar</button>
</form>
<div id="shop"></div>
<div class="row"><button class="btn small ghost" id="shop-from-menu" type="button">+ Agregar alimentos del menú</button></div>
</section>
<section class="panel"><h2>Objetivo diario</h2><div id="calc"></div>
<div class="grid">${fld("profile.deficitPct","Déficit % (grasa)","number",'min="10" max="20"')}${fld("profile.surplusPct","Superávit % (masa)","number",'min="5" max="10"')}${fld("profile.protPerKg","Proteína g/kg","number",'min="1.6" max="2.4"')}${fld("profile.fatPerKg","Grasa g/kg","number",'min="0.6" max="1.2"')}${fld("profile.kcalAdjust","Ajuste acumulado (kcal)","number")}</div>
</section>
<section class="panel"><div class="mealhead"><h2>Menú del día</h2><button class="btn small" id="add-meal">+ Comida</button></div>
<p class="lead">Escribe tus alimentos con gramos y macros, o pídele al Coach IA que te arme el menú con tus alimentos habituales. El total se compara contra tu objetivo (±5%).</p>
<div id="menu"></div><div id="menutot"></div></section>`;
function calcHTML(){
  const n=nutrition(); if(!n) return `<div class="empty">Completa edad, estatura y peso en <b>Perfil</b> para calcular tus calorías.</div>`;
  const p=S.profile;
  return `<div class="stats">
  <div class="stat"><span class="k">Calorías</span><span class="v">${r0(n.kcal)}<small>kcal</small></span><span class="x">${n.lab}${n.adj?` · ajuste ${n.adj>0?"+":""}${n.adj}`:""}</span></div>
  <div class="stat"><span class="k">Proteína</span><span class="v">${r0(n.prot)}<small>g</small></span><span class="x">${p.protPerKg} g × kg · ${r0(n.prot*4)} kcal</span></div>
  <div class="stat"><span class="k">Grasa</span><span class="v">${r0(n.fat)}<small>g</small></span><span class="x">${p.fatPerKg} g × kg · ${r0(n.fat*9)} kcal</span></div>
  <div class="stat"><span class="k">Carbohidratos</span><span class="v">${r0(n.carbs)}<small>g</small></span><span class="x">El resto de las calorías</span></div></div>
  <div class="formula">BMR  Mifflin-St Jeor = 10×${n.w} + 6.25×${p.height} − 5×${p.age} ${p.sex==="f"?"− 161":"+ 5"} = ${r0(n.bmr)} kcal
TDEE = BMR × ${n.af} (${p.days} días/sem) = ${r0(n.tdee)} kcal
Meta = TDEE × ${(1+n.pct).toFixed(2)}${n.adj?` ${n.adj>0?"+":"−"} ${Math.abs(n.adj)}`:""} = ${r0(n.kcal)} kcal</div>
  <p class="lead" style="font-size:13px">BMR: lo que gastas en reposo. TDEE: BMR por tu nivel de actividad. Proteína alta protege músculo; la grasa cubre hormonas; los carbohidratos alimentan carrera y sesiones de fuerza.</p>
  ${p.goal==="resistencia"&&p.days>=6?`<div class="note warn">Con long run + 5 sesiones de fuerza, si notas bajo rendimiento sube carbohidratos el día de carrera (+50–80 g) en vez de subir grasa.</div>`:""}`;
}
function refreshCalc(){const c=$("#calc");if(c)c.innerHTML=calcHTML();const t=$("#menutot");if(t)t.innerHTML=menuTotHTML()}
function menuHTML(){
  return S.menu.meals.map((m,mi)=>`<div class="block"><div class="block-head"><input id="meal-${m.id}" data-mi="${mi}" data-mk="name" value="${esc(m.name)}" aria-label="Nombre de la comida"><button class="iconbtn" data-act="del-meal" data-mi="${mi}" aria-label="Borrar comida">×</button></div>
  <div class="food food-h"><span class="fn">Alimento</span><span>g</span><span>kcal</span><span>P</span><span>C</span><span>G</span><span></span></div>
  ${m.items.map((f,fi)=>`<div class="food"><input class="fn" id="fd-${m.id}-${fi}-n" data-mi="${mi}" data-fi="${fi}" data-mk="food" value="${esc(f.food)}" placeholder="Alimento">${["g","kcal","p","c","f"].map(k=>`<input id="fd-${m.id}-${fi}-${k}" type="number" inputmode="decimal" step="any" data-mi="${mi}" data-fi="${fi}" data-mk="${k}" value="${esc(f[k])}" aria-label="${k}">`).join("")}<button class="iconbtn" data-act="del-food" data-mi="${mi}" data-fi="${fi}" aria-label="Borrar alimento">×</button></div>`).join("")}
  <div><button class="btn small ghost" data-act="add-food" data-mi="${mi}">+ Alimento</button></div></div>`).join("");
}
function menuTotals(){const t={kcal:0,p:0,c:0,f:0};S.menu.meals.forEach(m=>m.items.forEach(f=>{for(const k in t)t[k]+=num(f[k])||0}));return t}
function menuTotHTML(){
  const t=menuTotals(),n=nutrition(); if(!t.kcal) return "";
  let st="";
  if(n){const d=(t.kcal-n.kcal)/n.kcal*100;st=Math.abs(d)<=5?`<span class="pill ok">dentro de ±5%</span>`:`<span class="pill warn">${d>0?"+":""}${r1(d)}% vs objetivo</span>`}
  return `<div class="stats" style="margin-top:6px"><div class="stat"><span class="k">Total kcal ${st}</span><span class="v">${r0(t.kcal)}</span></div><div class="stat"><span class="k">P / C / G</span><span class="v" style="font-size:24px">${r0(t.p)} / ${r0(t.c)} / ${r0(t.f)}<small>g</small></span>${n?`<span class="x">Meta ${r0(n.prot)} / ${r0(n.carbs)} / ${r0(n.fat)} g</span>`:""}</div></div>`;
}
function menuInput(el){const m=S.menu.meals[+el.dataset.mi];if(el.dataset.fi===undefined)m.name=el.value;else{const k=el.dataset.mk;m.items[+el.dataset.fi][k]=k==="food"?el.value:(el.value===""?"":num(el.value))}saveDoc("menu");const t=$("#menutot");if(t)t.innerHTML=menuTotHTML()}
const SHOP_CATS=["Súper","Equipo","Suplementos","Otro"];
let shopCat="Súper"; try{shopCat=localStorage.getItem(LS+"-shopcat")||"Súper"}catch(e){}
function shopHTML(){
  const items=S.shopping.items||[], pend=items.filter(i=>!i.done), done=items.filter(i=>i.done);
  const row=i=>`<label class="shop-row ${i.done?"is-done":""}"><input type="checkbox" id="sh-${i.id}" data-shop="${i.id}" ${i.done?"checked":""}><span class="shop-t">${esc(i.text)}${i.qty?` <span class="m">${esc(i.qty)}</span>`:""}</span><button type="button" class="iconbtn" data-shopdel="${i.id}" aria-label="Quitar ${esc(i.text)}">×</button></label>`;
  if(!items.length)return `<div class="empty">Tu lista está vacía. Escribe arriba lo primero que necesitas comprar.</div>`;
  const groups=SHOP_CATS.map(c=>[c,pend.filter(i=>(i.cat||"Otro")===c)]).filter(g=>g[1].length);
  return `${pend.length?groups.map(([c,l])=>`<div class="shop-g"><div class="blk-t">${c} · ${l.length}</div>${l.map(row).join("")}</div>`).join(""):`<div class="note ok">Todo comprado.</div>`}
  ${done.length?`<details class="shop-g"><summary class="blk-t" style="cursor:pointer">Comprados · ${done.length}</summary>${done.map(row).join("")}<div class="row" style="margin-top:8px"><button type="button" class="btn small danger" id="shop-clear">Borrar comprados</button></div></details>`:""}`;
}
function shopRefresh(){const el=$("#shop");if(!el)return;el.innerHTML=shopHTML();const p=(S.shopping.items||[]).filter(i=>!i.done).length;$("#shop-count").textContent=p?`${p} pendiente${p>1?"s":""}`:"al día"}
function shopAdd(text,qty,cat){text=String(text||"").trim();if(!text)return false;
  const ex=S.shopping.items.find(i=>!i.done&&i.text.toLowerCase()===text.toLowerCase());
  if(ex){if(qty)ex.qty=qty;return false}
  S.shopping.items.push({id:uid(),text,qty:String(qty||"").trim(),cat:cat||"Otro",done:false,added:today()});return true}
AFTER.nutricion=()=>{refreshCalc();
  S.shopping.items=S.shopping.items||[];shopRefresh();
  $("#shop-form").onsubmit=e=>{e.preventDefault();const t=$("#shop-text"),q=$("#shop-qty"),c=$("#shop-cat");
    if(!t.value.trim()){t.focus();return}
    const added=shopAdd(t.value,q.value,c.value);saveDoc("shopping");shopRefresh();toast(added?"Agregado a la lista":"Ya estaba en la lista");t.value="";q.value="";t.focus()};
  $("#shop-cat").onchange=e=>{shopCat=e.target.value;try{localStorage.setItem(LS+"-shopcat",shopCat)}catch(_){}};
  $("#shop").onchange=e=>{const id=e.target.dataset.shop;if(!id)return;const it=S.shopping.items.find(i=>i.id===id);if(!it)return;it.done=e.target.checked;it.doneOn=it.done?today():"";saveDoc("shopping");
    /* strike through in place; it moves to "Comprados" next time the tab opens, so the list never shifts under your finger */
    const r=e.target.closest(".shop-row");if(r)r.classList.toggle("is-done",it.done);
    const p=S.shopping.items.filter(i=>!i.done).length;$("#shop-count").textContent=p?`${p} pendiente${p>1?"s":""}`:"al día"};
  $("#shop").onclick=e=>{
    const del=e.target.closest("[data-shopdel]");if(del){e.preventDefault();S.shopping.items=S.shopping.items.filter(i=>i.id!==del.dataset.shopdel);saveDoc("shopping");shopRefresh();return}
    const clr=e.target.closest("#shop-clear");if(clr){if(!clr.classList.contains("armed")){clr.classList.add("armed");clr.textContent="¿Seguro? Toca otra vez";return}
      S.shopping.items=S.shopping.items.filter(i=>!i.done);saveDoc("shopping");shopRefresh();toast("Comprados borrados")}};
  $("#shop-from-menu").onclick=()=>{let n=0;S.menu.meals.forEach(m=>m.items.forEach(f=>{if(shopAdd(f.food,"","Súper"))n++}));saveDoc("shopping");shopRefresh();toast(n?`${n} alimento${n>1?"s":""} del menú agregado${n>1?"s":""}`:"Nada nuevo que agregar del menú")};
$("#menu").innerHTML=menuHTML();$("#add-meal").onclick=()=>{S.menu.meals.push({id:uid(),name:"Comida",items:[]});saveDoc("menu");$("#menu").innerHTML=menuHTML()}};

/* ---------- RUTINA ---------- */
let openDays=new Set(["d1"]), editDays=new Set();
function secList(sec,di,bi){const d=S.routine.days[di];if(!d)return null;return sec==="w"?d.warmup:sec==="c"?d.cooldown:sec==="t"?(d.blocks[bi]||{}).items:sec==="b"?d.blocks:null}
function trainCount(d){return d.blocks.reduce((n,b)=>n+b.items.length,0)}
function rxChips(it){
  const c=[],reps=String(it.reps||"").trim(),noReps=!reps||reps==="—";
  const amt=noReps&&it.dist?`${it.dist} ${it.du}`:(reps||"—");
  c.push(`<span class="chip a">${esc(it.sets||"—")} × ${esc(amt)}</span>`);
  if(it.dist&&!noReps)c.push(`<span class="chip">${esc(it.dist)} ${esc(it.du)}</span>`);
  if(it.load)c.push(`<span class="chip">${esc(/^\d+([.,]\d+)?$/.test(String(it.load).trim())?"+"+it.load+" kg"+(it.kgMode==="db"?" DB":""):it.load)}</span>`);
  if(it.rir!==""&&it.rir!=null)c.push(`<span class="chip">RIR ${esc(it.rir)}</span>`);
  if(it.rest)c.push(`<span class="chip">desc ${esc(it.rest)}</span>`);
  return c.join("");
}
function checkSecRead(title,list){
  return `<div class="sec"><div class="sec-h"><span class="sec-t">${title}</span><span class="m">${list.length}</span></div>
  ${list.length?`<ul class="plain">${list.map(w=>`<li><span>${esc(w.name)}${w.notes?`<small>${esc(w.notes)}</small>`:""}</span><span class="m">${esc(w.amount||"")}</span></li>`).join("")}</ul>`:`<p class="lead" style="font-size:13px">Sin ejercicios.</p>`}</div>`;
}
function dayRead(d){
  return checkSecRead("Calentamiento",d.warmup)+
  `<div class="sec"><div class="sec-h"><span class="sec-t">Entrenamiento</span><span class="m">${trainCount(d)}</span></div>
  ${d.blocks.length?d.blocks.map(b=>`<div class="blk-t">${esc(b.title)}</div>${b.items.map(it=>`<div class="rx"><div class="rx-n">${esc(it.name)}${it.notes?`<small>${esc(it.notes)}</small>`:""}</div><div class="rx-c">${rxChips(it)}</div></div>`).join("")}`).join(""):`<p class="lead" style="font-size:13px">Sin ejercicios de entrenamiento.</p>`}</div>`+
  checkSecRead("Enfriamiento",d.cooldown);
}
const mvBtns=(sec,di,bi,ii,len)=>{const a=`data-sec="${sec}" data-di="${di}" data-bi="${bi}" data-ii="${ii}"`;
  return `<span class="mv"><button class="iconbtn" data-act="up" ${a} aria-label="Subir" ${ii===0?"disabled":""}>↑</button><button class="iconbtn" data-act="down" ${a} aria-label="Bajar" ${ii===len-1?"disabled":""}>↓</button><button class="iconbtn" data-act="del" ${a} aria-label="Borrar">×</button></span>`};
function checkSecEdit(sec,d,di){
  const list=sec==="w"?d.warmup:d.cooldown;
  return `${list.map((w,ii)=>{const a=`data-ri="${sec}" data-di="${di}" data-ii="${ii}"`;return `<div class="wrow"><input id="${sec}-${w.id}-n" ${a} data-k="name" value="${esc(w.name)}" aria-label="Ejercicio"><input id="${sec}-${w.id}-a" ${a} data-k="amount" value="${esc(w.amount||"")}" placeholder="3 min · 2×30" aria-label="Cantidad o tiempo">${mvBtns(sec,di,0,ii,list.length)}</div>`}).join("")}
  <div><button class="btn small ghost" data-act="add" data-sec="${sec}" data-di="${di}" data-bi="0">+ Ejercicio</button></div>`;
}
function trainEdit(it,di,bi,ii,len){
  const a=`data-ri="t" data-di="${di}" data-bi="${bi}" data-ii="${ii}"`;
  const f=(k,lab,ph,extra="")=>`<label>${lab}<input id="t-${it.id}-${k}" ${a} data-k="${k}" value="${esc(it[k]??"")}" placeholder="${ph}" ${extra}></label>`;
  return `<div class="tcard"><div class="top"><input id="t-${it.id}-name" ${a} data-k="name" value="${esc(it.name)}" aria-label="Ejercicio">${mvBtns("t",di,bi,ii,len)}</div>
  <div class="fields">${f("sets","Series","—",'inputmode="numeric"')}${f("reps","Reps / s","—")}${f("load","Carga kg","—")}<label>Kg en<select id="t-${it.id}-km" ${a} data-k="kgMode"><option value="" ${it.kgMode!=="db"?"selected":""}>Total</option><option value="db" ${it.kgMode==="db"?"selected":""}>DB (c/u)</option></select></label>${f("dist","Distancia","—",'inputmode="decimal"')}<label>Unidad<select id="t-${it.id}-du" ${a} data-k="du"><option value="" ${!it.du?"selected":""}>—</option><option value="m" ${it.du==="m"?"selected":""}>m</option><option value="km" ${it.du==="km"?"selected":""}>km</option></select></label>${f("rir","RIR obj.","—",'inputmode="decimal"')}${f("rest","Descanso","—")}</div>
  <input id="t-${it.id}-notes" ${a} data-k="notes" value="${esc(it.notes||"")}" placeholder="Notas (opcional)" aria-label="Notas"></div>`;
}
function dayEdit(d,di){
  return `<div class="grid wide"><label class="f">Título<input id="d-${d.id}-t" data-ri="day" data-di="${di}" data-k="title" value="${esc(d.title)}"></label><label class="f">Enfoque<input id="d-${d.id}-f" data-ri="day" data-di="${di}" data-k="focus" value="${esc(d.focus)}"></label></div>
  <div class="sec"><div class="sec-h"><span class="sec-t">Calentamiento</span><span class="m">checklist</span></div>${checkSecEdit("w",d,di)}</div>
  <div class="sec"><div class="sec-h"><span class="sec-t">Entrenamiento</span><span class="m">se registra serie por serie</span></div>
  ${d.blocks.map((b,bi)=>`<div class="blk-edit"><div class="block-head"><input id="b-${b.id}" data-ri="block" data-di="${di}" data-bi="${bi}" value="${esc(b.title)}" aria-label="Nombre del bloque">${mvBtns("b",di,0,bi,d.blocks.length)}</div>
    ${b.items.map((it,ii)=>trainEdit(it,di,bi,ii,b.items.length)).join("")}
    <div><button class="btn small ghost" data-act="add" data-sec="t" data-di="${di}" data-bi="${bi}">+ Ejercicio</button></div></div>`).join("")}
  <div><button class="btn small" data-act="add-block" data-di="${di}">+ Bloque de entrenamiento</button></div></div>
  <div class="sec"><div class="sec-h"><span class="sec-t">Enfriamiento</span><span class="m">checklist</span></div>${checkSecEdit("c",d,di)}</div>`;
}
VIEWS.rutina=()=>{
  const r=S.routine;
  return `<section class="panel"><h2>${esc(r.name)}</h2>
  <p class="lead">Cada día tiene tres secciones. <b>Calentamiento</b> y <b>Enfriamiento</b> se palomean en Hoy. Todo lo de <b>Entrenamiento</b> se registra serie por serie con reps, kg, distancia y RIR. Toca <b>Editar día</b> para agregar, quitar, cambiar u ordenar ejercicios.</p>
  ${routineSaved||dbState!=="cloud"?"":`<div class="note warn">Esta es la rutina base precargada. Se guarda en cuanto edites algo.</div>`}
  <label class="f">Nombre del programa<input id="r-name" data-ri="name" value="${esc(r.name)}"></label></section>
  ${r.days.map((d,di)=>{const ed=editDays.has(d.id);return `<details class="day" data-day="${d.id}" ${openDays.has(d.id)||ed?"open":""}><summary><span class="daynum">${di+1}</span><span class="daytitle">${esc(d.title)}<small>${esc(d.focus)}</small></span><span class="pill">${trainCount(d)} ej.</span></summary>
  <div class="daybody"><div class="row" style="justify-content:flex-end"><button class="btn small ${ed?"primary":""}" data-act="edit-day" data-day="${d.id}">${ed?"Listo":"Editar día"}</button></div>
  ${ed?dayEdit(d,di):dayRead(d)}</div></details>`}).join("")}
  <section class="panel"><h2>Metas a 12 meses</h2><div class="goals">${r.goals.map((g,gi)=>`<div class="goal"><input type="checkbox" id="g-${g.id}-d" data-ri="goal" data-gi="${gi}" data-k="done" ${g.done?"checked":""} aria-label="Cumplida"><input class="ga" id="g-${g.id}-a" data-ri="goal" data-gi="${gi}" data-k="area" value="${esc(g.area)}"><input id="g-${g.id}-t" data-ri="goal" data-gi="${gi}" data-k="text" value="${esc(g.text)}"><button class="iconbtn" data-act="del-goal" data-gi="${gi}" aria-label="Borrar meta">×</button></div>`).join("")}</div>
  <div><button class="btn small ghost" data-act="add-goal">+ Meta</button></div>
  <label class="f">Pregunta de la semana<input id="r-mind" data-ri="mindset" value="${esc(r.mindset)}"></label></section>
  <section class="panel"><div class="confirm" id="reset-box"><button class="btn small danger" data-act="reset-ask">Restaurar rutina base</button></div></section>`;
};
function routineInput(el){
  const r=S.routine,ds=el.dataset,v=el.type==="checkbox"?el.checked:el.value;
  if(ds.ri==="name")r.name=v;
  else if(ds.ri==="mindset")r.mindset=v;
  else if(ds.ri==="goal")r.goals[+ds.gi][ds.k]=v;
  else if(ds.ri==="day")r.days[+ds.di][ds.k]=v;
  else if(ds.ri==="block")r.days[+ds.di].blocks[+ds.bi].title=v;
  else{const arr=secList(ds.ri,+ds.di,+ds.bi);if(!arr||!arr[+ds.ii])return;if(arr[+ds.ii][ds.k]===v)return;arr[+ds.ii][ds.k]=v}
  saveDoc("routine");
}
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.day")){d.open?openDays.add(d.dataset.day):openDays.delete(d.dataset.day)}},true);

/* ---------- actions (routine / menu / progress) ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const ds=b.dataset,r=S.routine;
  const act=ds.act;

  draft={dayId:d.id,date:today(),entries:{},notes:"",done:{}};
  const sv=savedDraft();

function draftFromLog(l){
  const d=S.routine.days.find(x=>x.id===l.dayId)||S.routine.days[0];
  const dr={dayId:d.id,date:l.date,entries:{},notes:l.notes||"",done:{},editId:l.id,extra:[],kgMode:{}};
  const byName={},wc={};d.blocks.forEach(b=>b.items.forEach(it=>{byName[it.name]=it}));[...d.warmup,...d.cooldown].forEach(w=>{wc[w.name]=w});
  [...(l.warmupDone||[]),...(l.cooldownDone||[])].forEach(n=>{if(wc[n])dr.done[wc[n].id]=true});
  const groups={};(l.entries||[]).forEach(e=>{(groups[e.ex]||=[]).push(e)});
  Object.entries(groups).forEach(([name,es])=>{
    es.sort((a,b)=>(a.set||0)-(b.set||0));
    const rows=es.map(e=>({reps:e.reps??"",kg:num(e.kg)?e.kg:"",dist:e.dist??"",rir:e.rir??""}));
    const em=(es.find(e=>num(e.kg))||{}).kgMode;
    if(byName[name]){dr.entries[byName[name].id]=rows;if(em)dr.kgMode[byName[name].id]=em}
    else if(wc[name])dr.done[wc[name].id]=true;
    else{const id="x-"+uid();dr.extra.push({id,name,du:(es.find(e=>e.du)||{}).du||"",sets:String(rows.length),reps:"",load:"",rir:"",dist:"",rest:"",notes:""});dr.entries[id]=rows;if(em)dr.kgMode[id]=em}
  });

/* per-session series for the performance and running charts */
const isRun=e=>e.du&&!num(e.kg);
function sessionSeries(){
  const bw=num(S.profile.weight)||0, first={}, out=[];

    });
    const idx=Object.keys(best).map(ex=>{if(!first[ex])first[ex]=best[ex];return best[ex]/first[ex]*100});
    if(!ton&&!km&&!idx.length)return;

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function perfChart(){

  const W=640,H=250,L=48,R=44,T=18,Bm=30,iw=W-L-R,ih=H-T-Bm,n=ss.length,bw=iw/n;

  const X=i=>L+bw*i+bw/2,YL=v=>T+ih*(1-v/tMax),YR=v=>T+ih*(1-(v-lo)/(hi-lo));

  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga y rendimiento por sesión">
  ${[0,.5,1].map(f=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${YL(tMax*f)}" y2="${YL(tMax*f)}"/><text x="${L-6}" y="${YL(tMax*f)+4}" text-anchor="end">${r0(tMax*f)}</text>`).join("")}
  ${[lo,(lo+hi)/2,hi].map(v=>`<text x="${W-R+6}" y="${YR(v)+4}" text-anchor="start">${r0(v)}</text>`).join("")}
  <line x1="${L}" x2="${W-R}" y1="${YR(100)}" y2="${YR(100)}" stroke="var(--accent-mid)" stroke-dasharray="4 4"/>
  ${ss.map((s,i)=>`<rect class="bar" x="${(X(i)-bw*.32).toFixed(1)}" width="${(bw*.64).toFixed(1)}" y="${YL(s.ton).toFixed(1)}" height="${(T+ih-YL(s.ton)).toFixed(1)}" rx="2"><title>${s.date} · ${esc(s.day)}: ${s.ton} kg</title></rect>`).join("")}
  ${pts.length>1?`<path class="ln" d="${path}"/>`:""}
  ${pts.map((p,i)=>`<circle class="${i===pts.length-1?"end":"dt"}" cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}"><title>${p[2].date}: índice ${p[2].idx}</title></circle>`).join("")}
  ${ss.map((s,i)=>(i%step===0||i===n-1)?`<text x="${X(i)}" y="${H-10}" text-anchor="middle">${s.date.slice(5)}</text>`:"").join("")}
  <text x="${L}" y="11" text-anchor="start">kg</text><text x="${W-R+6}" y="11" text-anchor="start">índice</text>
  </svg>`;
}
function kmChart(){

  ${ss.map((s,i)=>`<rect class="bar ${s.km===maxKm||i===n-1?"hi":""}" x="${(X(i)-bw*.3).toFixed(1)}" width="${(bw*.6).toFixed(1)}" y="${Y(s.km).toFixed(1)}" height="${(T+ih-Y(s.km)).toFixed(1)}" rx="3"><title>${s.date} · ${esc(s.day)}: ${s.km} km</title></rect><text class="vl" x="${X(i)}" y="${Y(s.km)-6}" text-anchor="middle">${s.km}</text>`).join("")}

function lineChart(pts,unit){

}
const PRESETS=[
  ["prog","Revisar mi progresión","Analiza mis sesiones y check-ins. Para cada ejercicio de entrenamiento dime: qué carga/reps usar la próxima sesión, si toca descarga, y qué datos te faltan. Cierra con 3 prioridades para esta semana."],
  ["week","Plan de la semana","Con mi rutina actual, mis metas a 12 meses y mi progreso, propón el plan de esta semana día por día con ajustes concretos (series, reps, carga, RIR). Incluye opciones de 30 min para días ocupados."],
  ["recovery","Optimizar recuperación","Con mis datos de sueño, energía y volumen semanal, dame recomendaciones de recuperación concretas y si debo modificar algo de la carga semanal (running + calistenia)."],
  ["skills","Skills (handstand / planche)","Evalúa mi bloque de skills y propón la siguiente progresión hacia free handstand, strict HSPU y tuck/straddle planche, con criterios para avanzar de paso."]
];
let aiBusy=false, aiText="";
VIEWS.coach=()=>`
<section class="panel"><h2>Coach IA</h2><p class="lead">Lee tu perfil, rutina, sesiones y check-ins, y responde como tu coach. Sus respuestas son orientación; tú decides qué aplicar.</p>
<div class="row">${PRESETS.map(p=>`<button class="btn small" data-ai="${p[0]}">${p[1]}</button>`).join("")}</div>
<label class="f">Pregunta libre<textarea id="ai-q" placeholder="Ej. ¿Cómo meto natación sin afectar el día de pierna?"></textarea></label>
<div class="row"><button class="btn primary" id="ai-ask">Preguntar</button><button class="btn" id="ai-stop" hidden>Detener</button></div>
<div class="ai-out" id="ai-out">${aiText?fmt(aiText):`<span style="color:var(--muted)">La respuesta aparece aquí.</span>`}</div></section>
<section class="panel"><h2>Generar menú</h2><p class="lead">Arma un menú de un día con tus alimentos habituales, en gramos, dentro de ±5% de tus calorías. Reemplaza el menú actual en Nutrición.</p>
<div class="row"><button class="btn" id="ai-menu">Generar menú del día</button><span class="lead" id="ai-menu-st" style="font-size:13px"></span></div></section>`;
function fmt(t){return esc(t).replace(/^#{1,4}\s*(.+)$/gm,"<h4>$1</h4>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
let aiCtl=null;
async function ask(q){
  if(aiBusy)return;const sample=await (window.claude&&window.claude.use?window.claude.use("sample"):null);
  const out=$("#ai-out");
  if(!sample){out.innerHTML=`<span style="color:var(--muted)">El Coach IA no está disponible en esta vista. Ábrelo desde claude.ai con tu sesión iniciada.</span>`;return}
  aiBusy=true;aiCtl=new AbortController();$("#ai-stop").hidden=false;out.textContent="Pensando…";
  try{
    const r=await sample([{role:"user",content:`${SYS}\n\nMis datos (JSON):\n${context()}\n\nPetición: ${q}`}],{signal:aiCtl.signal,cache:false,modelTier:"default",onText:({text})=>{aiText=text;out.innerHTML=fmt(text)}});
    aiText=r.text;out.innerHTML=fmt(r.text)+(r.truncated?"\n\n<i>(respuesta recortada)</i>":"");
  }catch(e){out.textContent=e&&e.code==="not_granted"?"Sin permiso para usar el Coach IA.":e&&e.code==="rate_limited"?"Demasiadas consultas seguidas; espera un momento.":e&&e.name==="AbortError"?"Detenido.":"No se pudo obtener respuesta ("+(e&&e.code||"error")+")."}
  finally{aiBusy=false;const s=$("#ai-stop");if(s)s.hidden=true}
}
AFTER.coach=()=>{
  document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>ask(PRESETS.find(p=>p[0]===b.dataset.ai)[2]));
  $("#ai-ask").onclick=()=>{const q=$("#ai-q").value.trim();if(q)ask(q);else toast("Escribe tu pregunta")};
  $("#ai-stop").onclick=()=>aiCtl&&aiCtl.abort();
  $("#ai-menu").onclick=genMenu;
};
async function genMenu(){
  const st=$("#ai-menu-st"),n=nutrition();
  if(!n){st.textContent="Completa estatura y peso en Perfil primero.";return}
  const sample=await (window.claude&&window.claude.use?window.claude.use("sample"):null);
  if(!sample){st.textContent="No disponible en esta vista.";return}
  st.textContent="Armando menú…";
  const p=S.profile;
  try{
    const res=await sample.json(`${SYS}\n\nArma un menú de UN día para: ${r0(n.kcal)} kcal, proteína ${r0(n.prot)} g, grasa ${r0(n.fat)} g, carbohidratos ${r0(n.carbs)} g. Usa principalmente: ${p.foodsLike||"comida mexicana casera común"}. Excluye: ${p.foodsAvoid||"nada"}. Cocina ${p.cookPerWeek} veces por semana${p.cookPerWeek<=3?" (prioriza preparaciones por lote)":""}. 4 comidas. El total debe quedar dentro de ±5% de las calorías. Responde SOLO JSON: {"meals":[{"name":"Desayuno","items":[{"food":"Avena","g":80,"kcal":300,"p":10,"c":54,"f":6}]}],"tip":"una línea sobre reemplazos o batch cooking"}`,{modelTier:"default"});
    if(!res||!Array.isArray(res.meals))throw{code:"invalid_json"};
    const meals=res.meals.map(m=>({id:uid(),name:String(m.name||"Comida"),items:(m.items||[]).map(f=>({food:String(f.food||""),g:num(f.g)??"",kcal:num(f.kcal)??"",p:num(f.p)??"",c:num(f.c)??"",f:num(f.f)??""}))}));
    const tot=meals.reduce((s,m)=>s+m.items.reduce((a,f)=>a+(num(f.kcal)||0),0),0),d=(tot-n.kcal)/n.kcal*100;
    S.menu={meals};saveDoc("menu");
    st.textContent=`Listo: ${r0(tot)} kcal (${d>0?"+":""}${r1(d)}%). ${Math.abs(d)<=5?"Dentro de ±5%.":"Fuera de ±5%: ajusta porciones en Nutrición o genera de nuevo."} ${res.tip||""}`;
  }catch(e){st.textContent=e&&e.code==="not_granted"?"Sin permiso para usar el Coach IA.":"No se pudo generar ("+(e&&e.code||"error")+"). Intenta de nuevo."}
}

/* ======================= theme switch ======================= */
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function themePref(){try{return localStorage.getItem(LS+"-theme")}catch(e){return null}}
function isDark(){const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":!!(mq&&mq.matches)}
function paintSwitch(){const d=isDark(),b=$("#theme");b.setAttribute("aria-checked",String(d));$("#theme-lab").textContent=d?"Oscuro":"Claro";$("#theme-ic").textContent=d?"☾":"☀"}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);paintSwitch()}
{const p=themePref();if(p==="dark"||p==="light")applyTheme(p);else paintSwitch()}
$("#theme").onclick=()=>{const t=isDark()?"light":"dark";try{localStorage.setItem(LS+"-theme",t)}catch(e){}applyTheme(t)};
if(mq&&mq.addEventListener)mq.addEventListener("change",paintSwitch);
new MutationObserver(paintSwitch).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ======================= boot ======================= */
render();setSync();initDb();
</script>
