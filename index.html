<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Coach Daniel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Direction: a calm training logbook. White + blue by day, black + orange by night; one accent carries navigation, primary actions and data.
   Status colours follow meaning: green = done/correct, amber = caution, red = error/delete.
   Layout: sticky header with scrollable tab rail; one column of cards (max 960px); dense data rows scroll inside their own card. */
:root{
  /* palette — light */
  --bg:#f4f6fa; --surface:#ffffff; --sunk:#eef2f7; --field:#fbfcfe; --line:#dfe5ee; --line-strong:#c5cfdd;
  --fg:#0f1d33; --muted:#53627a;
  --accent:#1d5fd8; --accent-hover:#164db4; --accent-fg:#ffffff; --accent-soft:#e7eefc; --accent-mid:#a8c1ef;
  --ink:var(--accent); --ink-fg:var(--accent-fg);
  --ok:#17734a; --ok-bg:#e5f4ec; --warn:#8a4b00; --warn-bg:#fdf0dc; --bad:#b3261e; --bad-bg:#fbe9e7;
  --inverse:#0f1d33; --inverse-fg:#f4f6fa;
  --shadow-1:0 1px 2px rgba(15,29,51,.05),0 1px 1px rgba(15,29,51,.03);
  --shadow-2:0 8px 24px rgba(15,29,51,.16);
  /* type: two families, six sizes */
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:var(--f-body);
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:24px; --t-2xl:32px;
  /* spacing, radii, motion */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-sm:6px; --r:8px; --r-lg:12px; --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.3,1); --dur:180ms;
  --pad:var(--s4);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#151413; --sunk:#1d1b1a; --field:#1a1817; --line:#2b2826; --line-strong:#3f3a36;
  --fg:#f2ede7; --muted:#a89e94;
  --accent:#ff8a1e; --accent-hover:#ffa04a; --accent-fg:#1a0e03; --accent-soft:#2a1b0e; --accent-mid:#8a4c17;
  --ok:#5fd394; --ok-bg:#11261a; --warn:#f0b35c; --warn-bg:#2a1f10; --bad:#f28b7e; --bad-bg:#331816;
  --inverse:#f2ede7; --inverse-fg:#151413;
  --shadow-1:0 1px 0 rgba(0,0,0,.4); --shadow-2:0 10px 28px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#151413; --sunk:#1d1b1a; --field:#1a1817; --line:#2b2826; --line-strong:#3f3a36;
  --fg:#f2ede7; --muted:#a89e94;
  --accent:#ff8a1e; --accent-hover:#ffa04a; --accent-fg:#1a0e03; --accent-soft:#2a1b0e; --accent-mid:#8a4c17;
  --ok:#5fd394; --ok-bg:#11261a; --warn:#f0b35c; --warn-bg:#2a1f10; --bad:#f28b7e; --bad-bg:#331816;
  --inverse:#f2ede7; --inverse-fg:#151413;
  --shadow-1:0 1px 0 rgba(0,0,0,.4); --shadow-2:0 10px 28px rgba(0,0,0,.55);
  color-scheme:dark}
@media (min-width:720px){:root{--pad:var(--s5)}}

/* ---------- base ---------- */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--t-md);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
p{margin:0}
b{font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 var(--s7)}
/* screen-reader-only text: pinned to the left edge so it can never widen the page */
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
::selection{background:var(--accent-soft)}

/* ---------- header & navigation ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-top:var(--s4)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:var(--t-2xl);letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand-r{display:flex;align-items:center;gap:var(--s3);min-width:0}
.sync{font-size:var(--t-xs);color:var(--muted);text-align:right;line-height:1.3;display:flex;align-items:center;gap:var(--s2)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.sync.pend::before{background:var(--warn)}
.sync.bad{color:var(--bad)}
.sync.bad::before{background:var(--bad)}
.theme{display:flex;align-items:center;gap:var(--s2);background:transparent;border:0;color:var(--muted);cursor:pointer;padding:var(--s1);font:600 var(--t-xs)/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto;border-radius:var(--r-pill)}
.theme:hover{color:var(--fg)}
.theme .trk{position:relative;width:44px;height:24px;border-radius:var(--r-pill);background:var(--sunk);border:1px solid var(--line-strong)}
.theme .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-size:10px;line-height:1}
.theme[aria-checked="true"] .knob{left:22px}
@media (max-width:420px){.sync{font-size:11px;max-width:32vw}.theme #theme-lab{display:none}}
.tabs{position:relative;display:flex;gap:var(--s1);overflow-x:auto;padding:var(--s3) 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
@media (min-width:760px){.tabs{-webkit-mask-image:none;mask-image:none}}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:var(--f-display);font-size:var(--t-md);font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);border:0;border-radius:var(--r-pill);padding:0 var(--s4);min-height:36px;cursor:pointer}
.tabs button:hover{color:var(--fg);background:var(--sunk)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.loading{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-sm);color:var(--muted);padding-top:var(--s4)}
.loading[hidden]{display:none}
.loading::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-mid);border-top-color:var(--accent);flex:0 0 auto}
main{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s5)}
main.is-loading{opacity:.55}

/* ---------- type ---------- */
h2{font-family:var(--f-display);font-weight:700;font-size:var(--t-xl);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--f-body);font-weight:600;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--muted)}
.lead{color:var(--muted);max-width:66ch;font-size:var(--t-sm)}
.lead.sm{font-size:var(--t-xs)}
.lead b{color:var(--fg)}

/* ---------- surfaces ---------- */
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad);display:flex;flex-direction:column;gap:var(--s4);min-width:0;box-shadow:var(--shadow-1)}
section.panel>h2+.lead,section.panel>.mealhead+.lead{margin-top:calc(var(--s2) * -1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3) var(--s4)}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.mealhead{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.empty{color:var(--muted);font-size:var(--t-sm);border:1px dashed var(--line-strong);border-radius:var(--r);padding:var(--s5) var(--s4);text-align:center;background:var(--bg)}
.empty b{color:var(--fg)}

/* ---------- form controls ---------- */
label.f{display:flex;flex-direction:column;gap:6px;font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:var(--t-md);color:var(--fg);background:var(--field);border:1px solid var(--line-strong);border-radius:var(--r);padding:0 var(--s3);min-height:44px;width:100%;min-width:0;letter-spacing:normal;text-transform:none;font-weight:400;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background-color var(--dur) var(--ease)}
textarea{min-height:88px;padding:var(--s3);resize:vertical;line-height:1.5}
select{padding-right:var(--s6);appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed;background:var(--sunk)}
input[type=number],.num{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--ok);flex:0 0 auto;cursor:pointer}
input[type=checkbox]:focus{box-shadow:none}
input[type=date]{min-height:44px}
input[type=file]{padding:var(--s2);font-size:var(--t-sm);min-height:0}
input[type=file]::file-selector-button{font:600 var(--t-sm) var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:6px var(--s3);margin-right:var(--s3);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font:600 var(--t-sm)/1.2 var(--f-body);letter-spacing:.01em;border-radius:var(--r);padding:0 var(--s4);min-height:44px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);text-align:center;
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform 80ms var(--ease)}
.btn:hover{background:var(--sunk);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.small{min-height:36px;padding:0 var(--s3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn.danger,.btn.danger.ghost{color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn.armed,#shop-clear.armed{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.btn[disabled],.btn[disabled]:hover{opacity:.5;cursor:not-allowed;background:var(--surface);border-color:var(--line-strong);transform:none}
.btn.primary[disabled]{background:var(--accent);border-color:var(--accent)}
#save-session,#ci-save{min-width:200px}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;flex:0 0 auto;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:var(--t-md);line-height:1;
  transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.iconbtn:hover{background:var(--sunk);color:var(--fg);border-color:var(--line-strong)}
.iconbtn[data-shopdel],.iconbtn[data-act="del-log"],.iconbtn[data-act="del-checkin"]{color:var(--bad);border-color:transparent}
.iconbtn[data-act="del"]:hover,.iconbtn[data-act="del-log"]:hover,.iconbtn[data-act="del-checkin"]:hover,.iconbtn[data-act="del-food"]:hover,.iconbtn[data-act="del-meal"]:hover,.iconbtn[data-act="del-goal"]:hover,.iconbtn[data-shopdel]:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.iconbtn[disabled]{opacity:.3;cursor:default;background:transparent}
@media (pointer:coarse){.iconbtn{width:40px;height:40px}}
.note .btn{margin-left:var(--s2)}
.note .row{margin-top:var(--s2)}

/* segmented controls (unit pickers in Hoy) */
.segs{display:flex;flex-wrap:wrap;gap:var(--s2)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-pill);padding:2px;flex:0 0 auto}
.seg button{font:600 var(--t-xs)/1 var(--f-body);letter-spacing:.02em;background:transparent;color:var(--muted);border:0;border-radius:var(--r-pill);padding:0 10px;min-height:28px;cursor:pointer;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (pointer:coarse){.seg button{min-height:32px}}

/* ---------- feedback ---------- */
.note{border-radius:var(--r);padding:var(--s3) var(--s4);font-size:var(--t-sm);background:var(--sunk);color:var(--fg);line-height:1.5}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note b{font-weight:600}
.pill{display:inline-flex;align-items:center;font:500 var(--t-xs)/1 var(--f-body);font-variant-numeric:tabular-nums;padding:4px var(--s2);border-radius:var(--r-pill);background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.warn{color:var(--warn);background:var(--warn-bg)}.pill.bad{color:var(--bad);background:var(--bad-bg)}
.chip{font:500 var(--t-xs)/1.4 var(--f-body);font-variant-numeric:tabular-nums;padding:2px var(--s2);border-radius:var(--r-sm);background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));background:var(--inverse);color:var(--inverse-fg);padding:var(--s3) var(--s4);border-radius:var(--r-lg);font-size:var(--t-sm);font-weight:500;z-index:20;width:max-content;max-width:calc(100% - 32px);display:flex;gap:var(--s3);align-items:center;box-shadow:var(--shadow-2)}
.toast[hidden]{display:none}
.toast-undo{font:600 var(--t-sm)/1 var(--f-body);background:transparent;color:inherit;border:1px solid currentColor;border-radius:var(--r-pill);padding:0 var(--s3);min-height:32px;cursor:pointer;flex:0 0 auto}
.toast-undo:hover{background:rgba(127,127,127,.18)}
.confirm{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font-size:var(--t-sm)}

/* ---------- stats & formula ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
.stat{background:var(--sunk);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:var(--t-2xl);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font:500 var(--t-sm) var(--f-body);color:var(--muted);margin-left:var(--s1)}
.stat .x{font-size:var(--t-xs);color:var(--muted);line-height:1.4}
.formula{font-size:var(--t-xs);font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:var(--r);padding:var(--s3) var(--s4);overflow-x:auto;white-space:pre;line-height:1.7}

/* ---------- routine (days, read and edit views) ---------- */
details.day{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);min-width:0;box-shadow:var(--shadow-1);transition:border-color var(--dur) var(--ease)}
details.day[open]{border-color:var(--accent-mid)}
details.day>summary{list-style:none;cursor:pointer;padding:var(--s4) var(--pad);display:flex;gap:var(--s3);align-items:center;border-radius:var(--r-lg);transition:background-color var(--dur) var(--ease)}
details.day>summary:hover{background:var(--sunk)}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 var(--s1) 4px var(--s1);flex:0 0 auto;transition:transform var(--dur) var(--ease)}
details.day[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.day[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.daynum{font-family:var(--f-display);font-weight:700;font-size:var(--t-2xl);line-height:1;min-width:28px;color:var(--accent);font-variant-numeric:tabular-nums}
.daytitle{font-weight:600;min-width:0;flex:1;line-height:1.3}
.daytitle small{display:block;color:var(--muted);font-weight:400;font-size:var(--t-sm);margin-top:2px}
.daybody{padding:0 var(--pad) var(--pad);display:flex;flex-direction:column;gap:var(--s4)}
.sec{display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s4);border-top:1px solid var(--line)}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px var(--s3)}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:var(--t-lg);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);line-height:1.2}
.sec .m,.sec-h .m,.plain .m,.checklist .m{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plain li{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.plain li:last-child{border-bottom:0}
.plain li small,.rx-n small{display:block;font-weight:400;font-size:var(--t-xs);color:var(--muted)}
.blk-t{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:var(--s2)}
.rx{display:flex;justify-content:space-between;gap:var(--s2) var(--s3);align-items:baseline;padding:var(--s2) 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rx-n{font-weight:600;font-size:var(--t-sm);min-width:0;flex:1 1 170px}
.rx-c{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.block{border-top:1px solid var(--line);padding-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.block-head{display:flex;gap:var(--s2);align-items:center}
.block-head input{font-family:var(--f-display);font-weight:700;font-size:var(--t-lg);text-transform:uppercase;letter-spacing:.04em;background:transparent;border-color:transparent;padding:0 var(--s1);flex:1;min-width:0;min-height:40px}
.block-head input:hover{border-color:var(--line)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:var(--s2);align-items:center}
.wrow input,.tcard input,.tcard select{min-height:40px;font-size:var(--t-sm)}
.mv{display:flex;gap:var(--s1)}
.blk-edit{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3);border:1px dashed var(--accent-mid);border-radius:var(--r);background:var(--bg)}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);background:var(--surface)}
.tcard .top{display:flex;gap:var(--s2);align-items:center}
.tcard .top>input{flex:1;min-width:0;font-weight:600}

const uniqById=list=>[...new Map(list.map(r=>[r.id,r])).values()];

/* PEND remembers what has not reached the cloud yet: edited documents, saved records and deletions.
   It survives reloads, so a change made offline (or just before closing the tab) is uploaded next time instead of being overwritten. */
let PEND=lsGet(LS+"-pending",null);

for(const k of ["docs","recs","dels"]) if(!isObj(PEND[k]))PEND[k]={};

let lsTimer=0;
function lsSaveNow(){clearTimeout(lsTimer);lsTimer=0;lsOk=lsSet(LS,S);lsSet(LS+"-pending",PEND)}

/* ---- cloud copy ---- */
const timers={}, writing={};
let warnedSync=false;
function syncFail(e){
  syncErr=true;

}
function saveDoc(key){
  PEND.docs[key]=new Date().toISOString();lsSave();setSync();
  if(!db||!cloudReady)return;
  clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key),700);
}
async function flush(key){
  clearTimeout(timers[key]);timers[key]=0;
  if(!db||!cloudReady||!PEND.docs[key])return;
  if(writing[key]){timers[key]=setTimeout(()=>flush(key),400);return}
  writing[key]=true;const stamp=PEND.docs[key];
  try{
    await db.doc("coach/"+key).set({data:clone(S[key]),updated:new Date().toISOString()});
    if(PEND.docs[key]===stamp)delete PEND.docs[key];
    if(key==="routine")routineSaved=true;
    syncErr=false;
  }catch(e){syncFail(e)}
  finally{writing[key]=false;lsSave();setSync()}
}
function flushAll(){lsSaveNow();for(const k of Object.keys(timers)) if(timers[k])flush(k)}
async function pushRecord(k){
  if(!db||!cloudReady)return;
  const i=k.indexOf("/"),coll=k.slice(0,i),id=k.slice(i+1),rec=arr(S[coll]).find(r=>r.id===id),stamp=PEND.recs[k];
  if(!rec){delete PEND.recs[k];return}

  catch(e){syncFail(e)}

}
async function pushDelete(k){
  if(!db||!cloudReady)return;
  const i=k.indexOf("/"),coll=k.slice(0,i),id=k.slice(i+1);
  try{await db.collection(coll).doc(id).delete();delete PEND.dels[k];syncErr=false}
  catch(e){if(e&&e.code==="not_found")delete PEND.dels[k];else syncFail(e)}

}
function saveRecord(coll,rec){const k=coll+"/"+rec.id;delete PEND.dels[k];PEND.recs[k]=Date.now();memo=new Map();lsSaveNow();setSync();return pushRecord(k)}
function delRecord(coll,id){const k=coll+"/"+id;delete PEND.recs[k];PEND.dels[k]=Date.now();memo=new Map();lsSaveNow();setSync();return pushDelete(k)}
let retrying=false;
async function retryPending(){
  if(!db||!cloudReady||retrying)return;
  retrying=true;
  try{
    for(const k of Object.keys(PEND.docs))await flush(k);
    for(const k of Object.keys(PEND.dels))await pushDelete(k);
    for(const k of Object.keys(PEND.recs))await pushRecord(k);
  }finally{retrying=false;setSync()}
}
function setSync(t){
  const el=document.getElementById("sync");if(!el)return;
  const n=pendCount();
  el.textContent=t||(dbState==="loading"?"Conectando…":dbState==="cloud"?(n?(syncErr?"Pendiente de subir":"Guardando…"):"Guardado en la nube"):(lsOk?"Guardado en este navegador":"Sin espacio para guardar aquí"));
  el.classList.toggle("bad",(dbState==="cloud"&&n>0&&syncErr)||(dbState!=="cloud"&&!lsOk));

/* Reads the cloud and reconciles it with this browser: the cloud wins, except for changes made here that never got uploaded. */
async function pullCloud(first){
  const got={};let cloudRoutine=false;
  for(const key of DOC_KEYS){
    const snap=await db.doc("coach/"+key).get();
    const raw=snap.exists?snap.data():null;
    if(isObj(raw)&&raw.data!=null){
      if(key==="routine")cloudRoutine=true;
      const dirty=PEND.docs[key];
      if(!(dirty&&dirty>str(raw.updated))){got[key]=clone(raw.data);delete PEND.docs[key]}
    }else if(first&&isObj(loc)&&loc[key]!=null&&!PEND.docs[key])PEND.docs[key]=new Date().toISOString();
  }
  const recs={};
  for(const coll of REC_COLLS){
    const col=db.collection(coll),qs=await (col.limit?col.limit(1000):col).get();
    const norm=coll==="logs"?normLog:normCheckin,map=new Map();
    qs.docs.forEach(d=>{const v=clone(d.data());if(!isObj(v))return;if(!v.id&&d.id)v.id=d.id;const n=norm(v);if(n)map.set(n.id,n)});
    for(const k of Object.keys(PEND.dels)) if(k.startsWith(coll+"/"))map.delete(k.slice(coll.length+1));
    for(const r of S[coll]){
      const k=coll+"/"+r.id,rem=map.get(r.id);
      if(PEND.recs[k])map.set(r.id,r);
      /* first run after the update: records only this browser has (or has newer) are treated as not uploaded yet, as before */
      else if(first&&legacySync&&(!rem||str(r.savedAt)>str(rem.savedAt))){map.set(r.id,r);PEND.recs[k]=Date.now()}
    }
    recs[coll]=[...map.values()];
  }
  Object.assign(S,got,recs);
  if(normalizeAll()&&!PEND.docs.routine)PEND.docs.routine=new Date().toISOString();
  if(cloudRoutine)routineSaved=true;
  cloudReady=true;dbState="cloud";lsSaveNow();setSync();retryPending();
}
async function initDb(){
  const c=window.claude;
  if(!(c&&typeof c.use==="function")){dbState="local";setSync();return}
  dbState="loading";setSync();setLocked(true);
  /* editing is held for a moment so a stale copy from this browser can never be saved over newer cloud data */
  const slow=setTimeout(()=>{if(!cloudReady){setLocked(false);toast("La nube tarda en responder. Puedes seguir: se guarda aquí y se sincroniza después.")}},4000);
  try{db=await c.use("db")}catch(e){db=null}
  if(!db){clearTimeout(slow);dbState="local";setLocked(false);setSync();return}
  try{
    await pullCloud(true);clearTimeout(slow);
    const m=document.getElementById("main"),wasLocked=m&&m.inert;setLocked(false);
    if(wasLocked||!typing())render();
  }catch(e){clearTimeout(slow);dbState="local";setLocked(false);setSync("Sin nube por ahora: se guarda aquí")}
}
async function reconnect(){
  if(!db||cloudReady||reconnect.busy)return;
  reconnect.busy=true;
  try{await pullCloud(true);if(!typing())render()}catch(e){}finally{reconnect.busy=false}
}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();flushAll();return}
  if(!db)return;
  if(!cloudReady){reconnect();return}
  retryPending();
  /* a tab left open for a while re-reads the cloud, so edits made on another device are not overwritten from here */
  if(hiddenAt&&Date.now()-hiddenAt>120000&&!pendCount()&&!typing())pullCloud(false).then(()=>{if(!typing())render()}).catch(()=>{});
});
window.addEventListener("pagehide",flushAll);
window.addEventListener("online",()=>{cloudReady?retryPending():reconnect()});
setInterval(()=>{if(!db)return;if(!cloudReady)reconnect();else if(pendCount())retryPending()},45000);

const RED=/dolor agudo|dolor fuerte|mareo|desmay|dolor (en el )?pecho|condici[oó]n m[eé]dica|lesi[oó]n nueva|me lesion|punzante/i;

/* ======================= nutrition math ======================= */
function activity(days){days=+days||0;return days<=1?1.2:days<=3?1.375:days<=5?1.55:1.725}
/* why the numbers cannot be calculated yet, in words the person can act on ("" when everything is usable) */
function profileIssue(){
  const p=S.profile,w=num(p.weight),h=num(p.height),a=num(p.age);
  if(!w||!h||!a)return "Completa edad, estatura y peso en <b>Perfil</b> para calcular tus calorías.";
  if(h<120||h>230)return "Revisa tu estatura en <b>Perfil</b>: va en centímetros (por ejemplo 178).";
  if(w<30||w>250)return "Revisa tu peso en <b>Perfil</b>: va en kilogramos.";
  if(a<14||a>90)return "Revisa tu edad en <b>Perfil</b>.";
  return "";
}
function nutrition(){
  if(profileIssue())return null;
  const p=S.profile,w=num(p.weight),h=num(p.height),a=num(p.age),notes=[];
  /* safety limits: no extreme deficits or surpluses, protein and fat inside sensible ranges */
  const lim=(k,lo,hi,def,lab,u)=>{const raw=num(p[k]),v=clampN(p[k],lo,hi,def);if(raw!==null&&raw!==v)notes.push(`${lab}: se usa ${v}${u} (límite seguro ${lo}–${hi}${u}).`);return v};
  const dp=lim("deficitPct",0,25,17,"Déficit","%"),sp=lim("surplusPct",0,15,7,"Superávit","%"),pk=lim("protPerKg",1.2,3,2,"Proteína"," g/kg"),fk=lim("fatPerKg",0.5,1.5,0.9,"Grasa"," g/kg"),adj=lim("kcalAdjust",-600,600,0,"Ajuste acumulado"," kcal");
  const bmr=10*w+6.25*h-5*a+(p.sex==="f"?-161:5);
  const af=activity(p.days), tdee=bmr*af;
  let pct=0,lab="Mantenimiento";
  if(p.goal==="grasa"){pct=-dp/100;lab="Déficit "+dp+"%"}
  if(p.goal==="masa"){pct=sp/100;lab="Superávit "+sp+"%"}
  const kcal=tdee*(1+pct)+adj;
  const prot=pk*w, fat=fk*w;
  const carbs=Math.max(0,(kcal-prot*4-fat*9)/4);
  if(kcal<bmr)notes.push("Tu meta queda por debajo de lo que gastas en reposo (BMR). Súbela o revísalo con un profesional de la salud.");
  return {bmr,af,tdee,pct,lab,adj,kcal,prot,fat,carbs,w,pk,fk,notes};
}

/* ======================= training math ======================= */
function trackedExercises(){const s=new Set();S.routine.days.forEach(d=>d.blocks.forEach(b=>b.items.forEach(i=>s.add(i.name))));return [...s]}
/* distance helpers: everything is compared in metres, shown in the unit it was logged in */
/* weight can be logged as total or per dumbbell (DB); comparisons always use the total */
const kgTot=e=>(num(e.kg)||0)*(e.kgMode==="db"?2:1);
const toM=(d,u)=>d==null||d===""?null:(num(d)||0)*(u==="km"?1000:1);
const fmtDist=(m,u)=>m==null?"":u==="km"?`${r1(m/1000)} km`:`${r0(m)} m`;
function setLabel(s){
  const parts=[];
  if(num(s.kg)) parts.push(`${s.kg}kg${s.kgMode==="db"?" DB":""}`);
  if(s.reps!=null&&s.reps!=="") parts.push(s.ru?`${parts.length?" · ":""}${s.reps}${ruTxt(s.ru)}`:(parts.length?`×${s.reps}`:`${s.reps}`));
  if(s.du&&s.dist!=null&&s.dist!=="") parts.push(`${parts.length?" · ":""}${s.dist}${s.du}`);
  if(s.rir!=null&&s.rir!=="") parts.push(` @${s.rir}`);
  return parts.join("")||"–";
}
function sessionsFor(ex){
  if(memo.has(ex))return memo.get(ex);
  const out=S.logs.filter(l=>l.entries.some(e=>e.ex===ex&&(num(e.kg)!==null||num(e.reps)!==null||num(e.dist)!==null)))
    .map(l=>{const es=l.entries.filter(e=>e.ex===ex);
      const top=es.reduce((b,e)=>{const c={kg:kgTot(e),reps:num(e.reps)||0,m:toM(e.dist,e.du)||0,rir:num(e.rir),du:e.du||"",ru:e.ru||""};return(!b||better(c,b))?c:b},null);
      const totalM=es.reduce((a,e)=>a+(toM(e.dist,e.du)||0),0);
      return {id:l.id,date:l.date,sets:es,top,totalM,du:(es.find(e=>e.du)||{}).du||""}}).sort(byDate);
  memo.set(ex,out);return out;
}
function better(a,b){return a.kg>b.kg||(a.kg===b.kg&&(a.reps>b.reps||(a.reps===b.reps&&(a.m||0)>(b.m||0))))}
function topLabel(t){if(t.m&&!t.kg&&!t.reps)return fmtDist(t.m,t.du);const rp=`${t.reps}${ruTxt(t.ru)}`;return `${t.kg?`${t.kg} kg × `:""}${rp}${t.m?` · ${fmtDist(t.m,t.du)}`:""}`}
function topReps(r){const m=String(r).match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return +m[2];const n=num(r);return n}
function progressionHint(item){
  const ss=sessionsFor(item.name).filter(x=>!draft||(x.id!==draft.editId&&x.date<=draft.date)), rirT=num(item.rir);
  if(!ss.length) return {t:`Primera vez: elige una carga con RIR ${rirT??2} y regístrala.`,c:""};
  if(redFlag()) return {t:"Aumentos de carga en pausa por un aviso de salud reciente. Mantén la carga.",c:"bad"};
  const last=ss[ss.length-1],top=topReps(item.reps);
  const rirs=last.sets.map(s=>num(s.rir)).filter(v=>v!==null);
  const avgRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
  /* distance-based work: runs, carries, sled */
  if(item.du){
    const targetM=toM(item.dist,item.du), loaded=last.sets.some(s=>num(s.kg));
    const doneAll=targetM&&last.sets.length&&last.sets.every(s=>(toM(s.dist,s.du)||0)>=targetM);
    if(loaded){
      if(doneAll&&(avgRir===null||avgRir>=(rirT??1))) return {t:`Completaste ${fmtDist(targetM,item.du)} en todas las series: sube 2.5–5 kg por mano y mantén la distancia.`,c:"ok"};
      if(targetM&&!doneAll) return {t:`Misma carga hasta completar ${fmtDist(targetM,item.du)} en cada serie sin soltar.`,c:""};
      return {t:"Misma carga; busca más distancia o menos pausas.",c:""};
    }
    const lastM=last.totalM;
    if(lastM) return {t:`Última vez: ${fmtDist(lastM,item.du)}. Progresión segura: +5–10% por semana (≈ ${fmtDist(lastM*1.07,item.du)}) a ritmo conversacional; cada 4ª semana repite o baja.`,c:"ok"};
  }
  if(avgRir!==null&&rirT!==null&&avgRir<rirT-0.5) return {t:`Quedaste más cerca del fallo (RIR prom. ${r1(avgRir)}) que tu objetivo (RIR ${rirT}). Repite la carga y prioriza técnica.`,c:"warn"};
  const hit=top&&last.sets.length&&last.sets.every(s=>(num(s.reps)||0)>=top);
  const rirOk=last.sets.every(s=>num(s.rir)===null||num(s.rir)>=(rirT??1));
  const tu=ruOf(item);
  if(tu&&hit) return {t:`Llegaste a ${top}${ruTxt(tu)} en todas las series: pasa a la siguiente progresión (o agrega lastre) y vuelve a construir tiempo.`,c:"ok"};
  if(tu){const best=Math.max(...last.sets.map(x=>num(x.reps)||0));return {t:best?`Tu mejor serie fue ${best}${ruTxt(tu)}. Busca +${tu==="min"?"1–2 min":"3–5 s"} en alguna serie, con buena técnica.`:"Registra cuánto aguantaste en cada serie.",c:best?"ok":""}}
  if(hit&&rirOk) return {t:`Llegaste al tope del rango con RIR ≥ ${rirT??1}: sube ${item.kgMode==="db"?"1–2 kg por mancuerna":"1.25–2.5 kg"} (o pasa a la siguiente progresión).`,c:"ok"};
  if(hit) return {t:`Tope del rango, pero por debajo de RIR ${rirT??1}: repite carga antes de subir.`,c:"warn"};
  if(avgRir!==null&&rirT!==null&&avgRir>rirT+1.5) return {t:`Te sobraron reps (RIR prom. ${r1(avgRir)} vs objetivo ${rirT}): sube reps o carga la próxima.`,c:"ok"};
  return {t:"Misma carga, busca +1 rep en alguna serie.",c:""};
}
function stalls(){
  const out=[];
  for(const ex of trackedExercises()){
    const ss=sessionsFor(ex); if(ss.length<4) continue;
    const base=ss[ss.length-4].top, last3=ss.slice(-3);
    let best=base, improved=false;
    for(const s of last3){if(better(s.top,best)){improved=true;best=s.top}}
    if(!improved) out.push({ex,base,last3});
  }
  return out;
}
function suggestions(){
  const out=[], p=S.profile, c=S.checkins, basis=c.length?c[c.length-1].id:"";
  const gap=(x,y)=>(Date.parse(y.date)-Date.parse(x.date))/864e5;
  if(c.length>=3){
    const [a,b,d]=c.slice(-3), w=x=>num(x.weight);
    /* "2 semanas seguidas" needs three weigh-ins about a week apart, all with a weight and with adherence recorded */
    if(w(a)&&w(b)&&w(d)&&gap(a,b)>=5&&gap(b,d)>=5&&num(b.adherence)!==null&&num(d.adherence)!==null){
      const d1=w(b)-w(a), d2=w(d)-w(b), adh=Math.min(num(b.adherence),num(d.adherence));
      if(adh>=80){
        if(p.goal==="grasa"&&d1>=-0.1&&d2>=-0.1) out.push({type:"calorias",delta:-150,title:"Bajar 150 kcal",why:`Peso sin bajar 2 semanas seguidas (${w(a)} → ${w(b)} → ${w(d)} kg) con adherencia ≥ ${adh}%.`});
        if(p.goal==="masa"&&d1<=0.05&&d2<=0.05) out.push({type:"calorias",delta:150,title:"Subir 150 kcal",why:`Peso sin subir 2 semanas seguidas (${w(a)} → ${w(b)} → ${w(d)} kg) con adherencia ≥ ${adh}%.`});
      }
    }
  }
  if(c.length>=2){
    const l=c.slice(-2), v=[num(l[0].energy),num(l[1].energy),num(l[0].sleep),num(l[1].sleep)];
    /* only when energy and sleep were actually filled in both check-ins */
    if(v.every(x=>x!==null)){
      const e=(v[0]+v[1])/2, s=(v[2]+v[3])/2;
      if(e<5||s<5) out.push({type:"volumen",title:"Reducir volumen 20%",why:`Energía promedio ${r1(e)}/10, sueño ${r1(s)}/10 en las últimas 2 semanas.`});
    }
  }
  /* an adjustment can be applied once per check-in; after that it shows as applied until the next check-in */
  out.forEach(s=>{s.basis=basis;s.applied=p.adjustments.some(a=>a.basis===basis&&a.kind===s.type)});
  for(const st of stalls()) out.push({type:"ejercicio",ex:st.ex,title:`Cambiar esquema: ${st.ex}`,why:`3 sesiones sin superar ${topLabel(st.base)}. Prueba otro rango (p. ej. 5×5 ↔ 3×8–10), una variante o una semana de descarga.`});
  return out;
}

function renderTabs(){

function goTab(k,focus){
  if(!TABS.some(x=>x[0]===k))return;

/* ---------- layout by screen size ----------
   On a computer (1100px or wider) related panels sit side by side; on a phone the single column stays exactly as it is.
   Only the position of finished panels changes: ids, handlers and data are untouched. */
const wideMQ=window.matchMedia?matchMedia("(min-width:1100px)"):null;
function arrangeWide(m){
  m.classList.remove("split");m.dataset.view=tab;
  if(!(wideMQ&&wideMQ.matches))return;
  const kids=[...m.children],isPanel=e=>e.matches("section.panel");
  let before=[],L=[],R=[],after=[],kind="";
  if(tab==="progreso"){L=kids.slice(0,2);R=kids.slice(2);const last=R[R.length-1];if(last&&last.querySelector("h3")&&last.querySelector("table")&&!last.querySelector("svg")){R.pop();L.push(last)}}
  else if(tab==="nutricion"){L=kids.slice(0,2);R=kids.slice(2)}
  else if(tab==="perfil"){const h=Math.ceil(kids.length/2);L=kids.slice(0,h);R=kids.slice(h);kind="even"}
  else if(tab==="guia"){before=kids.slice(0,1);kids.slice(1).forEach((k,i)=>(i%2?R:L).push(k));kind="even"}
  else if(tab==="hoy"){
    kids.forEach(k=>{if(!isPanel(k))R.push(k);else if(k.querySelector("[data-act=edit-log]"))after.push(k);else L.push(k)});
    kind="hoy";if(!R.length)return;
  }else return;
  if(!L.length||!R.length)return;
  const box=document.createElement("div"),a=document.createElement("div"),b=document.createElement("div");
  box.className="cols "+kind;a.className="col";b.className="col";box.append(a,b);
  m.insertBefore(box,[...L,...R][0]);
  a.append(...L);b.append(...R);after.forEach(e=>m.appendChild(e));before.forEach(e=>m.insertBefore(e,box));
  m.classList.add("split");
}

/* phones: the brand row folds away while scrolling so the tabs and your sets get the space; it returns near the top.
   The scroll position is compensated so the content never jumps. */
(function(){
  const hdr=document.querySelector("header.top"),narrow=window.matchMedia?matchMedia("(max-width:759px)"):null;
  if(!hdr||!narrow)return;
  let compact=false,ticking=false;
  function update(){
    ticking=false;
    const y=window.scrollY||0,want=narrow.matches&&(compact?y>8:y>72);
    if(want===compact)return;
    const h0=hdr.offsetHeight;compact=want;hdr.classList.toggle("compact",compact);
    /* folding keeps what you are looking at in place; unfolding happens at the top, where the page should simply start from its beginning */
    const d=h0-hdr.offsetHeight;if(compact&&d)window.scrollBy(0,-d);
  }
  addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});
  const re=()=>update();narrow.addEventListener?narrow.addEventListener("change",re):narrow.addListener(re);
})();

async function saveFile(name,text){

function sessionsCSV(){

function parseBackup(text){
  let j;try{j=JSON.parse(text)}catch(e){return {error:"Ese texto no es un respaldo válido (no es JSON). Revisa que esté completo."}}
  const d=isObj(j)&&isObj(j.data)?j.data:j;
  if(!isObj(d)||![...DOC_KEYS,...REC_COLLS].some(k=>d[k]!=null))return {error:"No parece un respaldo de Coach: no trae perfil, rutina ni sesiones."};
  return {data:d,exported:isObj(j)?str(j.exported).slice(0,10):""};
}
function applyBackup(d){
  preImport={docs:clone({profile:S.profile,routine:S.routine,menu:S.menu,shopping:S.shopping}),logs:clone(S.logs),checkins:clone(S.checkins)};
  const docs=DOC_KEYS.filter(k=>d[k]!=null),touched=[];
  docs.forEach(k=>{S[k]=clone(d[k])});
  REC_COLLS.forEach(coll=>{
    const norm=coll==="logs"?normLog:normCheckin,map=new Map(S[coll].map(r=>[r.id,r]));
    arr(d[coll]).forEach(x=>{const n=norm(isObj(x)?clone(x):x);if(n){map.set(n.id,n);touched.push(coll+"/"+n.id)}});
    S[coll]=[...map.values()];
  });
  normalizeAll();
  docs.forEach(k=>{PEND.docs[k]=new Date().toISOString()});
  touched.forEach(k=>{delete PEND.dels[k];PEND.recs[k]=Date.now()});
  /* the open session draft belongs to the previous routine */
  draft=null;todayDay=null;lsDel(LS+"-draft");
  lsSaveNow();setSync();retryPending();
}
function undoImport(){
  if(!preImport)return;const p=preImport;preImport=null;
  DOC_KEYS.forEach(k=>{S[k]=p.docs[k];PEND.docs[k]=new Date().toISOString()});
  REC_COLLS.forEach(coll=>{
    const before=new Map(p[coll].map(r=>[r.id,r]));
    S[coll].forEach(r=>{const k=coll+"/"+r.id;if(!before.has(r.id)){delete PEND.recs[k];PEND.dels[k]=Date.now()}});
    p[coll].forEach(r=>{const cur=S[coll].find(x=>x.id===r.id);if(!cur||JSON.stringify(cur)!==JSON.stringify(r)){delete PEND.dels[coll+"/"+r.id];PEND.recs[coll+"/"+r.id]=Date.now()}});
    S[coll]=p[coll];
  });
  normalizeAll();draft=null;todayDay=null;lsDel(LS+"-draft");
  lsSaveNow();setSync();retryPending();render();toast("Restauración deshecha");
}

function rxChips(it){

function fixDraft(d){

function draftFromLog(l){
  const d=S.routine.days.find(x=>x.id===l.dayId)||S.routine.days[0];
  const dr={dayId:d.id,date:l.date,entries:{},notes:l.notes||"",done:{},editId:l.id,extra:[],kgMode:{},ruMode:{}};
  const items=[],wc=Object.create(null),used=new Set();

  [...(l.warmupDone||[]),...(l.cooldownDone||[])].forEach(n=>{if(wc[n])dr.done[wc[n].id]=true});
  /* grouped by exercise and block, so two exercises with the same name on one day keep their own sets */
  const groups=new Map();
  (l.entries||[]).forEach(e=>{const k=e.ex+"\u0001"+(e.block||"");if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
  groups.forEach(es=>{

    const rows=es.map(e=>({reps:e.reps??"",kg:num(e.kg)?e.kg:"",dist:e.dist??"",rir:e.rir??""}));

const isRun=e=>!!(e.du&&num(e.dist)&&!num(e.kg));
function sessionSeries(){
  const bw=num(S.profile.weight)||70, first=Object.create(null), out=[];
  [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    let ton=0,km=0;const best=Object.create(null);
    l.entries.forEach(e=>{
      if(isRun(e)){km+=(toM(e.dist,e.du)||0)/1000;return}
      const kg=kgTot(e),reps=num(e.reps)||0,rir=num(e.rir)||0,timed=!!e.ru,key=e.ex+(timed?"\u0001t":"");
      if(!timed)ton+=kg*reps;
      /* strength: estimated 1RM (Epley). Timed work: time under load. Each exercise is only compared with itself. */
      if(reps>0){const sc=timed?(bw+kg)*reps:(bw+kg)*(1+(reps+rir)/30);if(sc>0&&(!best[key]||sc>best[key]))best[key]=sc}
    });
    const idx=Object.keys(best).map(ex=>{if(!first[ex])first[ex]=best[ex];return best[ex]/first[ex]*100});
    if(!ton&&!km&&!idx.length)return;
    out.push({date:l.date,day:l.dayTitle||"",ton:r0(ton),km:r1(km),idx:idx.length?r1(idx.reduce((a,b)=>a+b,0)/idx.length):null});
  });

}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function perfChart(){

  ${[0,.5,1].map(f=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${YL(tMax*f)}" y2="${YL(tMax*f)}"/><text x="${L-6}" y="${YL(tMax*f)+4}" text-anchor="end">${r0(tMax*f)}</text>`).join("")}

  ${ss.map((s,i)=>(i%step===0||i===n-1)?`<text x="${X(i)}" y="${H-10}" text-anchor="middle">${s.date.slice(5)}</text>`:"").join("")}
  <text x="${L}" y="11" text-anchor="start">kg</text><text x="${W-R+6}" y="11" text-anchor="start">índice</text>
  </svg>`;

let chartMetric=null;
function exChart(exs){

  if(ss.some(s=>s.totalM)) avail.push(["dist","Distancia total"]);
  if(ss.some(s=>s.sets.some(x=>num(x.rir)!==null))) avail.push(["rir","RIR promedio"]);

function lineChart(pts,unit){

  ${pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text x="${X(i)}" y="${H-10}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${p.x.slice(5)}</text>`:"").join("")}

function applySuggestion(si){

function undoAdjustment(){

    /* only the most recent check-in moves the weight used for the calorie calculation */
    if(rec.weight&&S.checkins[S.checkins.length-1].id===rec.id&&S.profile.weight!==rec.weight){S.profile.weight=rec.weight;saveDoc("profile")}
    setCi({});saveRecord("checkins",rec);render();toast(isRed(rec.notes)?"Guardado. Lee el aviso de salud.":msg);
  };
};

/* ---------- GUÍA ---------- */
VIEWS.guia=()=>`
<section class="panel guide"><h2>Cómo usar tu Coach</h2>
<p class="lead">Todo se guarda solo mientras escribes. El indicador de arriba dice dónde: <b>nube</b> (tu cuenta de claude.ai, solo tú la lees) o <b>este navegador</b>.</p>
<h3>Tu semana en 4 pasos</h3>
<ol>
<li><b>Una vez:</b> llena <b>Perfil</b> (edad, estatura, peso, objetivo, equipo, lesiones, alimentos). Con eso se calculan tus calorías.</li>
<li><b>Cada entreno:</b> abre <b>Hoy</b>, palomea el calentamiento, registra cada serie del entrenamiento, palomea el enfriamiento y toca <b>Guardar sesión</b>.</li>
<li><b>Cada ${esc(S.profile.checkinDay||"domingo")}:</b> haz el <b>check-in</b> en <b>Progreso</b> y revisa los ajustes sugeridos.</li>
<li><b>Cuando quieras:</b> pregúntale al <b>Coach IA</b> por tu progresión, tu plan de la semana o tus skills.</li>
</ol></section>

<section class="panel guide"><h2>Rutina = tu plan</h2><ul>
<li>Cada día tiene 3 secciones: <b>Calentamiento</b>, <b>Entrenamiento</b> y <b>Enfriamiento</b>.</li>
<li>Se ve en modo lectura. Toca <b>Editar día</b> para agregar, quitar, renombrar u ordenar (↑ ↓) ejercicios, y <b>Listo</b> al terminar.</li>
<li><b>Calentamiento y Enfriamiento:</b> solo nombre y cantidad o tiempo ("3 min", "2 × 30"). En Hoy salen como palomitas.</li>
<li><b>Entrenamiento:</b> se organiza en bloques (Skill, Main Strength, Core…). Cada ejercicio lleva series, reps, carga, distancia + unidad, RIR objetivo, descanso y notas.</li>
<li><b>RIR objetivo:</b> la app compara tu RIR real contra este número para decirte si subir o mantener.</li>
<li><b>Distancia:</b> elige m o km (Long Run, Farmer Carry, sprints). Si la dejas en "—", en Hoy la columna usa metros.</li>
<li><b>Restaurar rutina base</b> vuelve al programa original sin borrar tus registros.</li>
</ul></section>

<section class="panel guide"><h2>Hoy = tu registro</h2><ul>
<li>Abre solo el día de la semana: lunes = Día 1 … domingo = Día 7. Puedes cambiarlo en <b>Sesión</b>.</li>
<li><b>Medida de cada ejercicio:</b> el selector <b>Reps | Seg | Min</b> cambia la primera columna. Holds (handstand, L-sit, planche leans) van en <b>Seg</b> y las prácticas largas (kick-ups) en <b>Min</b>; se detecta sola desde la rutina y la puedes cambiar con un toque. El tiempo cuenta como tu métrica de progreso.</li>
<li>Todos los ejercicios de Entrenamiento aparecen con sus series y 4 casillas: <b>Reps / Seg / Min</b> según la medida, <b>Kg</b> (lastre sobre tu peso; vacío si es peso corporal), <b>distancia</b> y <b>RIR</b> (reps que te faltaron para el fallo). Llena solo las que apliquen.</li>
<li>El texto gris en cada casilla es lo que hiciste la vez pasada. Debajo verás la <b>sugerencia de progresión</b>. Usa <b>+ Serie / − Serie</b> si hiciste más o menos series.</li>
<li>Escribe en <b>Notas</b> molestias o sensaciones. Si escribes "dolor agudo", "mareo" o similar, aparece un aviso médico y se pausan las subidas de carga.</li>
<li><b>Repetir última vez</b> llena las casillas vacías con lo que hiciste en tu sesión anterior; ajusta solo lo que cambió.</li>
<li>Lo que escribes queda como borrador aunque cierres la app; se registra al tocar <b>Guardar sesión</b>. Si dejas una sesión a medias y abres otro día, aparece un aviso para <b>Continuar</b> o <b>Descartar</b> la que quedó sin guardar.</li>
<li>En <b>Sesiones guardadas</b> puedes editar o borrar sesiones pasadas. Solo queda una sesión por fecha.</li>
</ul></section>

<section class="panel guide"><h2>Cómo decide la progresión</h2><ul>
<li><b>Fuerza (doble progresión):</b> primero subes reps dentro del rango. Si llegas al tope en todas las series con RIR ≥ tu objetivo, sube 1.25–2.5 kg.</li>
<li>Si tu RIR real queda por debajo del objetivo, repite la carga. Si te sobran reps, te avisa que subas.</li>
<li><b>Carries:</b> si completas la distancia en todas las series, sube 2.5–5 kg.</li>
<li><b>Carrera:</b> +5–10% de distancia por semana a ritmo conversacional; cada 4ª semana repite o baja.</li>
</ul></section>

<section class="panel guide"><h2>Nutrición</h2><ul>
<li>Las calorías se calculan con <b>Mifflin-St Jeor</b> × un factor de actividad según tus días de entreno, más el déficit o superávit de tu objetivo. Por seguridad el déficit se limita a 25% y el superávit a 15%.</li>
<li>Proteína y grasa van por kg de peso; los carbohidratos son el resto. Puedes mover los porcentajes y g/kg.</li>
<li><b>Ajuste acumulado</b> guarda los cambios de calorías que aplicas desde Progreso.</li>
<li>El menú es editable; el total te dice si estás dentro de ±5% de tu meta. También lo puedes generar en Coach IA.</li>
<li><b>Lista de compras:</b> arriba de Nutrición. Agrega cosas por categoría (súper, equipo, suplementos, otro), palomea al comprarlas y borra los comprados cuando quieras. <b>+ Agregar alimentos del menú</b> pasa tu menú del día a la lista.</li>
</ul></section>

<section class="panel guide"><h2>Progreso</h2><ul>
<li><b>Check-in:</b> peso promedio (pésate 3 o más mañanas), medidas, adherencia, energía, sueño, hambre y la habilidad nueva del mes.</li>
<li><b>Reglas automáticas:</b>
  <ul><li>Peso sin moverse 2 semanas con adherencia ≥ 80% → ±150 kcal.</li>
  <li>Energía o sueño promedio menor a 5 → −20% de series en el entrenamiento.</li>
  <li>3 sesiones sin superar tu mejor serie → cambia el esquema o el ejercicio.</li></ul></li>
<li>Toca <b>Aplicar</b> para aceptar un ajuste: se aplica una sola vez por check-in, queda en el historial con el dato que lo motivó y el más reciente se puede <b>Deshacer</b>.</li>
<li>Los check-ins se pueden <b>Editar</b>; si guardas otro con la misma fecha, se actualiza el que ya existe.</li>
<li><b>Gráficas:</b> rendimiento y carga (100 = tu inicio), kilómetros por sesión, peso, cintura y cada ejercicio de entrenamiento (carga, reps, distancia o RIR).</li>
</ul></section>

<section class="panel guide"><h2>Coach IA y tus datos</h2><ul>
<li>El Coach IA lee tu perfil, rutina, últimas sesiones, check-ins y reglas activas. Solo funciona dentro de claude.ai; la primera vez te pedirá permiso.</li>
<li>Sus respuestas son orientación: tú decides qué cambiar en la rutina.</li>
<li><b>Respaldo:</b> en Perfil puedes descargar o copiar tu respaldo (JSON), descargar tus sesiones en CSV para una hoja de cálculo y <b>restaurar</b> un respaldo. Guárdalo en un lugar <b>privado</b>, nunca en un repo público.</li>
<li><b>Deshacer:</b> al borrar una sesión, un check-in, un ejercicio, una comida o algo de la lista, aparece <span class="kbd">Deshacer</span> durante unos segundos.</li>
<li><b>Indicador de guardado</b> (arriba a la derecha): «Guardado en la nube», «Guardando…», «Pendiente de subir» (sin conexión: se sube solo al volver) o «Guardado en este navegador» cuando no hay nube.</li>
<li><b>Tema:</b> el switch de arriba cambia entre claro (azul) y oscuro (naranja) y recuerda tu elección.</li>
</ul></section>`;

/* ---------- COACH IA ---------- */
const SYS=`Eres el Fitness & Training Coach de Daniel: disciplinado, empático, profesional y basado en evidencia. Responde en español, claro y conciso, con estructura (calentamiento, bloques principales, enfriamiento, movilidad) cuando aplique y explica el porqué en una línea por recomendación. Prioriza progresión, prevención de lesiones y constancia; integra hábitos y psicología deportiva cuando ayude. Reglas de seguridad: nunca propongas déficits mayores a 25%, ayunos prolongados ni suplementos de riesgo; si hay dolor agudo, mareo o una condición médica, recomienda consultar a un médico y no subas cargas. Si te faltan datos (cargas, RM, tiempos), dilo y pide exactamente cuáles.`;
function context(){
  const n=nutrition();
  const logs=S.logs.slice(-12).map(l=>({date:l.date,day:l.dayTitle,sets:l.entries.map(e=>`${e.ex} s${e.set}: ${e.kg}kg${e.kgMode==="db"?" por mancuerna":""}×${e.reps??"-"}${ruTxt(e.ru)}${e.du&&e.dist!=null?` ${e.dist}${e.du}`:""}${e.rir!=null?` RIR${e.rir}`:""}`),calentamiento:l.warmupDone,enfriamiento:l.cooldownDone,notes:l.notes}));
  const routine=S.routine.days.map((d,i)=>({dia:i+1,titulo:d.title,calentamiento:d.warmup.map(w=>`${w.name}${w.amount?" "+w.amount:""}`),entrenamiento:d.blocks.map(b=>({bloque:b.title,ejercicios:b.items.map(it=>`${it.name} ${it.sets}×${it.reps}${it.load?" @"+it.load:""}${it.rir!==""&&it.rir!=null?" RIR obj "+it.rir:""}${it.dist?` dist ${it.dist}${it.du}`:""}`)})),enfriamiento:d.cooldown.map(w=>`${w.name}${w.amount?" "+w.amount:""}`)}));
  return JSON.stringify({perfil:{...S.profile,adjustments:S.profile.adjustments.slice(-5)},nutricion:n&&{kcal:r0(n.kcal),proteina_g:r0(n.prot),grasa_g:r0(n.fat),carbs_g:r0(n.carbs)},rutina:{nombre:S.routine.name,dias:routine,metas:S.routine.goals},sesiones_recientes:logs,checkins:S.checkins.slice(-6),ajustes_sugeridos_por_reglas:suggestions().map(s=>s.title+": "+s.why)});
}
const PRESETS=[
  ["prog","Revisar mi progresión","Analiza mis sesiones y check-ins. Para cada ejercicio de entrenamiento dime: qué carga/reps usar la próxima sesión, si toca descarga, y qué datos te faltan. Cierra con 3 prioridades para esta semana."],
  ["week","Plan de la semana","Con mi rutina actual, mis metas a 12 meses y mi progreso, propón el plan de esta semana día por día con ajustes concretos (series, reps, carga, RIR). Incluye opciones de 30 min para días ocupados."],
  ["recovery","Optimizar recuperación","Con mis datos de sueño, energía y volumen semanal, dame recomendaciones de recuperación concretas y si debo modificar algo de la carga semanal (running + calistenia)."],
  ["skills","Skills (handstand / planche)","Evalúa mi bloque de skills y propón la siguiente progresión hacia free handstand, strict HSPU y tuck/straddle planche, con criterios para avanzar de paso."]
];
let aiBusy=false, aiText="";
VIEWS.coach=()=>`
<section class="panel"><h2>Coach IA</h2><p class="lead">Lee tu perfil, rutina, sesiones y check-ins, y responde como tu coach. Sus respuestas son orientación; tú decides qué aplicar.</p>
<div class="row">${PRESETS.map(p=>`<button class="btn small" data-ai="${p[0]}">${p[1]}</button>`).join("")}</div>
<label class="f">Pregunta libre<textarea id="ai-q" placeholder="Ej. ¿Cómo meto natación sin afectar el día de pierna?"></textarea></label>
<div class="row"><button class="btn primary" id="ai-ask">Preguntar</button><button class="btn" id="ai-stop" type="button" ${aiBusy?"":"hidden"}>Detener</button></div>
<div class="ai-out" id="ai-out">${aiText?fmt(aiText):`<span style="color:var(--muted)">La respuesta aparece aquí.</span>`}</div></section>
<section class="panel"><h2>Generar menú</h2><p class="lead">Arma un menú de un día con tus alimentos habituales, en gramos, dentro de ±5% de tus calorías. Reemplaza el menú actual en Nutrición.</p>
<div class="row"><button class="btn" id="ai-menu">Generar menú del día</button><span class="lead sm" id="ai-menu-st"></span></div></section>`;
function fmt(t){return esc(t).replace(/^#{1,4}\s*(.+)$/gm,"<h4>$1</h4>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
let aiCtl=null;
async function ask(q){
  if(aiBusy)return;const sample=await (window.claude&&window.claude.use?window.claude.use("sample"):null);
  const out=$("#ai-out"), live=()=>$("#ai-out")||out; /* the tab may be re-rendered while the answer streams */
  if(!sample){out.innerHTML=`<span style="color:var(--muted)">El Coach IA no está disponible en esta vista. Ábrelo desde claude.ai con tu sesión iniciada.</span>`;return}
  aiBusy=true;aiCtl=new AbortController();$("#ai-stop").hidden=false;out.textContent="Pensando…";
  try{
    const r=await sample([{role:"user",content:`${SYS}\n\nMis datos (JSON):\n${context()}\n\nPetición: ${q}`}],{signal:aiCtl.signal,cache:false,modelTier:"default",onText:({text})=>{aiText=text;live().innerHTML=fmt(text)}});
    aiText=r.text;live().innerHTML=fmt(r.text)+(r.truncated?"\n\n<i>(respuesta recortada)</i>":"");
  }catch(e){live().textContent=e&&e.code==="not_granted"?"Sin permiso para usar el Coach IA.":e&&e.code==="rate_limited"?"Demasiadas consultas seguidas; espera un momento.":e&&e.name==="AbortError"?"Detenido.":"No se pudo obtener respuesta ("+(e&&e.code||"error")+")."}
  finally{aiBusy=false;const s=$("#ai-stop");if(s)s.hidden=true}
}
AFTER.coach=()=>{
  document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>ask(PRESETS.find(p=>p[0]===b.dataset.ai)[2]));
  $("#ai-ask").onclick=()=>{const q=$("#ai-q").value.trim();if(q)ask(q);else toast("Escribe tu pregunta")};
  $("#ai-stop").onclick=()=>aiCtl&&aiCtl.abort();
  $("#ai-menu").onclick=genMenu;
};
async function genMenu(){
  const st=$("#ai-menu-st"),n=nutrition();
  if(!n){st.textContent="Completa estatura y peso en Perfil primero.";return}
  const sample=await (window.claude&&window.claude.use?window.claude.use("sample"):null);
  if(!sample){st.textContent="No disponible en esta vista.";return}
  st.textContent="Armando menú…";
  const p=S.profile;
  try{
    const res=await sample.json(`${SYS}\n\nArma un menú de UN día para: ${r0(n.kcal)} kcal, proteína ${r0(n.prot)} g, grasa ${r0(n.fat)} g, carbohidratos ${r0(n.carbs)} g. Usa principalmente: ${p.foodsLike||"comida mexicana casera común"}. Excluye: ${p.foodsAvoid||"nada"}. Cocina ${p.cookPerWeek} veces por semana${p.cookPerWeek<=3?" (prioriza preparaciones por lote)":""}. 4 comidas. El total debe quedar dentro de ±5% de las calorías. Responde SOLO JSON: {"meals":[{"name":"Desayuno","items":[{"food":"Avena","g":80,"kcal":300,"p":10,"c":54,"f":6}]}],"tip":"una línea sobre reemplazos o batch cooking"}`,{modelTier:"default"});
    if(!res||!Array.isArray(res.meals)||!res.meals.some(m=>isObj(m)&&arr(m.items).length))throw{code:"invalid_json"};
    const meals=res.meals.filter(isObj).map(m=>({id:uid(),name:String(m.name||"Comida"),items:arr(m.items).filter(isObj).map(f=>({food:String(f.food||""),g:num(f.g)??"",kcal:num(f.kcal)??"",p:num(f.p)??"",c:num(f.c)??"",f:num(f.f)??""}))}));
    const tot=meals.reduce((s,m)=>s+m.items.reduce((a,f)=>a+(num(f.kcal)||0),0),0),d=(tot-n.kcal)/n.kcal*100;
    const prev=clone(S.menu);S.menu={meals};saveDoc("menu");
    toast("Menú del día reemplazado",()=>{S.menu=prev;saveDoc("menu");render();toast("Menú anterior restaurado")});
    st.textContent=`Listo: ${r0(tot)} kcal (${d>0?"+":""}${r1(d)}%). ${Math.abs(d)<=5?"Dentro de ±5%.":"Fuera de ±5%: ajusta porciones en Nutrición o genera de nuevo."} ${str(res.tip).slice(0,300)}`;
  }catch(e){st.textContent=e&&e.code==="not_granted"?"Sin permiso para usar el Coach IA.":"No se pudo generar ("+(e&&e.code||"error")+"). Intenta de nuevo."}
}

/* ======================= theme switch ======================= */
const mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function themePref(){try{return localStorage.getItem(LS+"-theme")}catch(e){return null}}
function isDark(){const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":!!(mq&&mq.matches)}
function paintSwitch(){const d=isDark(),b=$("#theme");b.setAttribute("aria-checked",String(d));$("#theme-lab").textContent=d?"Oscuro":"Claro";$("#theme-ic").textContent=d?"☾":"☀"}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);paintSwitch()}
{const p=themePref();if(p==="dark"||p==="light")applyTheme(p);else paintSwitch()}
$("#theme").onclick=()=>{const t=isDark()?"light":"dark";try{localStorage.setItem(LS+"-theme",t)}catch(e){}applyTheme(t)};
if(mq&&mq.addEventListener)mq.addEventListener("change",paintSwitch);
new MutationObserver(paintSwitch).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ======================= boot ======================= */
render();setSync();initDb();
</script>
